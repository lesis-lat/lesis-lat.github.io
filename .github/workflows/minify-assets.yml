name: Minify assets

on:
  push:
    branches:
      - main
    paths:
      - "assets/css/**/*.css"
      - "assets/scripts/**/*.js"
      - "!assets/css/**/*.min.css"
      - "!assets/scripts/**/*.min.js"

permissions:
  contents: write

jobs:
  minify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Minify CSS
        run: npx clean-css-cli@5.6.3 -o assets/css/style.min.css assets/css/style.css

      - name: Minify JS
        run: |
          npx terser@5.31.0 assets/scripts/landing.js -c -m -o assets/scripts/landing.min.js
          npx terser@5.31.0 assets/scripts/analytics.js -c -m -o assets/scripts/analytics.min.js

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/css/style.min.css assets/scripts/landing.min.js assets/scripts/analytics.min.js
          git commit -m "chore: minify css and js"
          git push
