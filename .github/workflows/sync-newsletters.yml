name: Sync newsletters

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: write
  pull-requests: write
  pages: write

concurrency:
  group: sync-newsletters-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Fetch public newsletters from Kit
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
        run: bundle exec ruby script/sync_newsletters.rb

      - name: Validate generated data
        run: >-
          ruby -rjson -e 'data = JSON.parse(File.read(ARGV.fetch(0)));
          abort("Expected a JSON array") unless data.is_a?(Array);
          missing = data.reject { |item| item["slug"].is_a?(String) &&
          File.file?(File.join("_newsletters", "#{item["slug"]}.html")) };
          abort("Missing generated newsletter pages") unless missing.empty?'
          _data/newsletters.json

      - name: Detect newsletter updates
        id: changes
        run: |
          if [ -z "$(git status --porcelain -- _data/newsletters.json _newsletters)" ]; then
            echo "Newsletter data is already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create or update pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: sync newsletters from Kit"
          branch: "automation/sync-newsletters"
          title: "chore: sync newsletters from Kit"
          body: "Automated sync of newsletter data and generated newsletter pages from Kit."
          add-paths: |
            _data/newsletters.json
            _newsletters
