  closing:
    title: ["Todo proyecto empieza", "con la pregunta", "que realmente tienes."]
    text: >-
      Cuéntanos qué necesitas averiguar: sobre un sistema que operas, una empresa que estás por comprar, un diseño que nadie ha construido todavía, o algo que ya ocurrió. Te respondemos con el alcance, el método y el cronograma.

