    - "A través de modelos de colaboración flexibles, los socios pueden ofrecer los servicios de LESIS con su propia marca, combinar nuestra experiencia con las soluciones que ya ofrecen o referir clientes que necesitan apoyo especializado en seguridad."
  become: "Conviértete en socio"
  subject: "Alianza"
  levels_link: "Niveles de alianza"
  benefits:
    title: "Beneficios"
    intro: "Un socio suma nuestros ingenieros, nuestra investigación y nuestra plataforma a lo que ya ofrece, y conserva la relación con el cliente."
    items:
      - title: "Experiencia especializada"
        text: "Accede a investigadores y consultores de seguridad con experiencia para apoyar proyectos complejos y críticos."
      - title: "Portafolio ampliado"
        text: "Suma evaluaciones de seguridad, investigación de vulnerabilidades, consultoría y herramientas a la medida a lo que ya ofreces."
      - title: "Modelos flexibles"
        text: "Elige entre entrega white-label, alianzas de referidos u ofertas de servicio integradas."
      - title: "Sin infraestructura adicional"
        text: "Amplía tus capacidades de ciberseguridad sin crear ni mantener un equipo especializado interno."
      - title: "Soporte técnico y comercial"
        text: "Recibe apoyo en la evaluación de oportunidades, la definición del alcance, la elaboración de propuestas y la entrega técnica."
      - title: "Soluciones personalizadas"
        text: "Combina los servicios de LESIS con tus propias capacidades para crear ofertas a la medida de cada cliente."
  levels:
    title: "Niveles de alianza"
    intro: "El programa se estructura en cuatro niveles, según el compromiso, las oportunidades de negocio y la colaboración de cada socio con LESIS."
    items:
      - name: "Bronce"
        text:
          - "El nivel de entrada para las empresas que comienzan su alianza con LESIS."
          - "Incluye acceso a los materiales estándar de la alianza, una presentación de los servicios de LESIS y apoyo durante el proceso de venta inicial."
      - name: "Plata"
        text:
          - "Pensado para socios que desarrollan oportunidades recurrentes con LESIS."
          - "Incluye todos los beneficios del nivel Bronce, apoyo comercial adicional y la participación de LESIS en reuniones seleccionadas con clientes."
      - name: "Oro"
        text:
          - "Para socios consolidados que trabajan de cerca con LESIS en oportunidades de ciberseguridad."
          - "Incluye todos los beneficios de los niveles anteriores, soporte técnico ampliado y la posibilidad de desarrollar contenido co-branded e iniciativas conjuntas."
      - name: "Platino"
        text:
          - "El nivel más alto de la alianza, pensado para relaciones estratégicas y de largo plazo."
          - "Incluye todos los beneficios de los niveles anteriores, soporte prioritario, una colaboración más cercana con el equipo de LESIS, acceso a iniciativas seleccionadas y oportunidades de visibilidad conjunta en eventos y campañas de co-marketing."
    note: "Los niveles de alianza y los criterios de elegibilidad se evalúan de forma individual, según el perfil, el compromiso y la relación del socio con LESIS."
  closing:
    title: ["Construye ofertas", "de seguridad más sólidas", "con LESIS."]
    text: "Ya sea que quieras ampliar tu portafolio de servicios, entregar proyectos de ciberseguridad con tu propia marca o conectar a tus clientes con experiencia especializada en seguridad, podemos ayudarte a definir el modelo de alianza adecuado."
    button: "Conviértete en socio de LESIS"

