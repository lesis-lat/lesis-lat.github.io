  ways:
    title: "Formas de trabajar con LESIS"
    intro: >-
      Trabaja con nosotros en un problema técnico definido o mediante una colaboración continua de ingeniería. Ambas incluyen investigación, orientación práctica y seguimiento de los hallazgos.
    projects:
      title: "Proyectos"
      lead: "Un trabajo con alcance cerrado: un sistema, un objetivo técnico, un método y un cronograma definidos."
      services:
        - title: "Ingeniería de Seguridad"
          summary: "Trabajamos junto a tus ingenieros en la arquitectura, los controles de seguridad y el ciclo de desarrollo seguro de un producto a medida que evoluciona."
          body:
            - >-
              Revisamos diseños, mapeamos límites de confianza y flujos de datos, y ayudamos a tu equipo a evaluar decisiones de seguridad antes y durante la implementación. La colaboración puede abarcar un sistema nuevo, una migración o cambios en un producto existente, con investigación y validación focalizadas cuando hace falta.
            - >-
              También incorporamos la seguridad de aplicaciones a tu ciclo de desarrollo (SSDLC). Seleccionamos, implementamos y ajustamos SAST, DAST y SCA para tu stack y tu pipeline de CI/CD, definimos los umbrales a partir de los cuales un build falla y hacemos el triage de lo que reportan las herramientas, para que los ingenieros reciban hallazgos reales y accionables en lugar de una cola de alertas. Cuando encaja, usamos herramientas que mantenemos, como <a href="https://github.com/lesis-lat/security-gate" target="_blank" rel="noopener noreferrer">Security Gate</a>.
        - title: "Investigación de Vulnerabilidades"
          summary: "Investigamos cómo puede comprometerse tu sistema, con evidencia reproducible y orientación para la remediación."
          body:
            - >-
              Definimos el alcance de la evaluación a partir del modelo de amenazas y la superficie de ataque del producto. Según el sistema, el trabajo combina pruebas de aplicaciones e infraestructura, revisión de arquitectura y de código, e ingeniería inversa. Investigamos cadenas de ataque, explicamos su impacto y volvemos a probar las correcciones.
        - title: "Herramientas de Seguridad a la Medida"
          summary: "Construimos los fuzzers, analizadores e instrumentación necesarios para investigar tu sistema."
          body:
            - >-
              Desarrollamos herramientas en torno a formatos, interfaces y comportamientos específicos, desde harnesses de prueba hasta análisis a la medida. El alcance define qué debe examinar la herramienta y cómo la usará tu equipo, ya sea para una investigación focalizada o para pruebas recurrentes.
            - >-
              Parte de ese trabajo funciona sobre modelos de lenguaje, donde rinden mejor que una regla fija: revisar cambios de código en busca de comportamiento relevante para la seguridad antes del merge, hacer el triage de la salida de los analizadores frente al código al que apunta, o probar las funcionalidades basadas en modelos de tu propio producto contra prompt injection y exposición de datos. Cada una se mide frente a los casos que debe detectar antes de que tu equipo dependa de ella.
        - title: "Investigación de Incidentes"
          summary: "No conducimos la respuesta; nos sumamos al equipo que la conduce, para una parte de ella: establecer cómo comenzó la intrusión, y demostrarlo en lugar de afirmarlo."
          body:
            - >-
              La mayor parte de lo que exige un incidente le corresponde al equipo que ya lo está atendiendo: contención, erradicación, comunicación. No tomamos eso a nuestro cargo. Nuestro papel es la puerta de entrada. Llevamos la evidencia hasta la debilidad específica que hizo posible la intrusión y luego demostramos esa debilidad, reproduciendo el camino en lugar de señalar una causa probable, para que la conclusión se sostenga cuando alguien la cuestione. Lo que resulta no es un relato sino un hallazgo: un punto de entrada con evidencia, una severidad, un plazo y un retest, vinculado en la plataforma a los sistemas afectados y a la línea de tiempo de la investigación de la que surgió. Vale la pena contratarlo para un conjunto acotado de incidentes. Cuando la puerta de entrada ya se conoce, o cuando no se explotó nada técnico, no hay nada que debamos demostrar, y lo decimos antes de que empiece el trabajo, no después.
        - title: "Due Diligence"
          summary: "Evaluamos lo que trae consigo una transacción, ya sea una empresa, una base de código o un producto que estás por adoptar, en los plazos que la transacción permite."
          body:
            - >-
              La decisión de adquirir, invertir o adoptar algo se toma contra un plazo, y por lo general con menos acceso que en un proyecto común. Trabajamos dentro de ambas condiciones. Antes del cierre, establecemos la postura de seguridad de lo que se está comprando hasta donde lo permite el acceso disponible, y separamos lo que simplemente está desordenado de lo que saldrá caro después. Después del cierre, los mismos ingenieros examinan los sistemas adquiridos con el acceso que ahora permite la propiedad, y señalan lo que hay que resolver antes de integrar los entornos. El mismo trabajo aplica cuando estás evaluando un producto en lugar de una empresa: lo evaluamos en tu nombre, sin ninguna relación con su proveedor. En todos los casos, el resultado es un registro en la plataforma, donde cada hallazgo tiene evidencia, severidad y un plazo, y permanece abierto hasta que se corrige, para que la evaluación siga sirviendo a quien sea responsable del sistema después.
    program:
      title: "Colaboración continua"
      lead:
        - "Trabaja con un equipo de ingeniería de seguridad que acumula conocimiento de tus sistemas a lo largo del tiempo."
        - >-
          Juntos definimos prioridades y una cadencia de revisiones de diseño, evaluaciones focalizadas e investigación técnica. A medida que tu producto cambia, revisamos sus supuestos y ayudamos a tus ingenieros a enfrentar nuevos riesgos. La plataforma es donde ese trabajo se acumula: el contexto de cada revisión, evaluación e investigación pasa a la siguiente, para que tu operación de seguridad deje de reconstruir lo que ya se sabe y cada ciclo profundice más en el problema.
    partners: >-
      Las consultoras pueden entregar nuestras evaluaciones e investigaciones con su propia marca, o referirnos clientes, a través del <a href="{partnership_url}">Programa de Alianzas de LESIS</a>, sin necesidad de armar un equipo interno.

  record:
    eyebrow: "Investigación, experiencia &amp; comunidad"
    title: "Trabajo que puedes verificar"
    intro: >-
      Divulgaciones públicas de vulnerabilidades, experiencia dentro de grandes empresas de tecnología y contribuciones a la comunidad de seguridad a través de competencias y charlas en conferencias.
    items:
      - title: "Vulnerabilidades publicadas"
        text: >-
          Miembros de nuestro equipo han reportado vulnerabilidades a D-Link, documentadas en <a href="https://nvd.nist.gov/vuln/detail/CVE-2020-9376" target="_blank" rel="noopener noreferrer">CVE-2020-9376</a> y <a href="https://nvd.nist.gov/vuln/detail/CVE-2020-9377" target="_blank" rel="noopener noreferrer">CVE-2020-9377</a>, y a MISP, registrada como <a href="https://nvd.nist.gov/vuln/detail/CVE-2020-28043" target="_blank" rel="noopener noreferrer">CVE-2020-28043</a>. Su trabajo también incluye reportes a Oracle y Apple, con registros públicos en el <a href="https://www.oracle.com/security-alerts/cpujul2022.html" target="_blank" rel="noopener noreferrer">Critical Patch Update de julio de 2022 de Oracle</a> y en los <a href="https://support.apple.com/en-gb/102774" target="_blank" rel="noopener noreferrer">agradecimientos de seguridad de servidores web de Apple</a>.
      - title: "Participación en competencias CTF"
        text: >-
          Miembros de nuestro equipo han competido en eventos Capture The Flag, obteniendo el primer lugar en el CTF de BSides São Paulo y ganando una etapa clasificatoria de Hackaflag. LESIS también apoya equipos de la comunidad: en <a href="https://www.sbseg2026.uff.br/" target="_blank" rel="noopener noreferrer">SBSeg 2026</a>, el equipo GRIS/UFRJ, con el apoyo de LESIS, <a href="{bulletin_url}">quedó en primer lugar entre 18 equipos</a> en desafíos de análisis de tráfico, forense e investigación de incidentes.
      - title: "Experiencia en líderes del mercado"
        text: >-
          Nuestro equipo incluye ingenieros que han trabajado en empresas como Nubank, el mayor banco digital de América Latina, y Globo, la mayor empresa de medios de Brasil, así como en los principales proveedores de ciberseguridad de Brasil y en otras empresas igual de sólidas, aunque menos conocidas. Aportan a su trabajo en LESIS la experiencia con las exigencias de ingeniería de sistemas que atienden a millones de personas.
      - title: "Charlas en eventos de seguridad"
        text: >-
          Miembros de nuestro equipo han dado charlas en eventos como BxSec, Roadsec, BSides Rio de Janeiro y XibéSec. Estas contribuciones llevan la experiencia de nuestro equipo a discusiones con otros profesionales de seguridad y ayudan a compartir conocimiento en la comunidad de seguridad de Brasil.

  work:
    transition: "Explora nuestras investigaciones publicadas y herramientas de código abierto."
    tool: "Herramienta de código abierto"
    no_release: "Sin versión publicada"
    tools:
      security_gate: "Aplica umbrales de seguridad configurables a las alertas de GitHub para que tu equipo pueda exigir verificaciones en su pipeline de CI/CD."
      bunkai: "Examina las dependencias de proyectos Perl en busca de módulos desactualizados y vulnerabilidades conocidas, con resultados que se integran a los flujos de desarrollo."
      kasumi: "Extrae y busca mensajes de Slack por palabra clave y rango de fechas para apoyar evaluaciones de seguridad autorizadas."
    all_publications: "Todas las publicaciones &rarr;"
