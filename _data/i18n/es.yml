# --- Home page ----------------------------------------------------------------
home:
  hero:
    eyebrow: "La Plataforma LESIS"
    title: "Una plataforma de ciberseguridad AI-native <span class='hero-title-sub'>para todo tu programa.</span>"
    lead: >-
      Vulnerabilidades, código, superficie de ataque, conocimiento e incidentes.<br>La IA verifica cada hallazgo antes de que llegue a tu equipo, y los ingenieros de LESIS responden por cada decisión.
    see_platform: "Conoce la plataforma"
    screen: "Security posture"
    alt: "La página de postura de seguridad de LESIS: hallazgos con plazo vencido, tiempo de corrección y los puntos de atención que piden una decisión."
    video_alt: "Un recorrido por LESIS: de la página de postura de seguridad a la lista de vulnerabilidades, un hallazgo crítico con su árbol de ataque y evidencia, los indicadores de corrección y de vuelta a la postura."
    caption: "Pantallas del producto, con una organización ficticia"

  clients:
    label: "Organizaciones que LESIS ya ayudó a proteger"
    title: "A quiénes ya ayudamos a proteger"
    empty: "Fintechs, retail, salud, telecomunicaciones y lawtechs"

  what:
    eyebrow: "Por qué LESIS"
    display: "Los equipos de seguridad no necesitan más alertas. Necesitan hallazgos con alguien detrás."
    text:
      - >-
        La mayoría de los programas de seguridad funciona como un mosaico: un escáner aquí, una planilla de hallazgos allá, el PDF de una consultora, un runbook en el drive de alguien. Nadie puede decir, en cualquier momento, qué está abierto, quién es responsable y si está mejorando.
      - >-
        LESIS reemplaza el mosaico por un solo registro. Cada hallazgo tiene evidencia, un responsable y un plazo. La IA lee tu código y reporta solo lo que puede probar. Los ingenieros de LESIS deciden lo que necesita a una persona. La dirección ve postura, no ruido.

  media:
    pause: "Pausar animación"
    play: "Reproducir animación"

  platform:
    eyebrow: "La plataforma"
    title: "Todo sobre lo que funciona tu programa de seguridad."
    intro: >-
      Todas las capacidades funcionan sobre los mismos datos, para que un hallazgo en el código, un threat model y un incidente apunten a los mismos sistemas y a las mismas personas.
    features:
      - label: "Postura y analítica"
        title: "Sabe dónde estás, en cualquier momento."
        text: "Doce meses de hallazgos abiertos, corregidos y cerrados, tiempo de corrección por severidad y los puntos de atención que piden una decisión ahora, cada uno con su motivo y el siguiente paso."
        points: ["Postura de seguridad y salud de la remediación", "Puntos de atención con siguiente paso", "Cuánto vale lo que encontró tu programa", "Benchmark con organizaciones comparables"]
        image: "analytics"
        height: 1100
        screen: "Analytics"
        alt: "La página de analítica de LESIS: al recorrer doce meses de hallazgos abiertos, resueltos y cerrados aparecen las cifras de cada mes y, después, el tiempo medio de corrección por severidad."
      - label: "Gestión de vulnerabilidades"
        title: "Cada hallazgo, de la primera evidencia a la prueba de la corrección."
        text: "Un ciclo de vida de ocho estados, un plazo según la severidad, evidencias y comentarios en el propio hallazgo y árboles de ataque dibujados a partir del análisis. Los remediadores hacen avanzar los hallazgos; cerrarlos le corresponde a un analista."
        points: ["Plazos por severidad, definidos por tu organización", "Árboles de ataque en el hallazgo", "Comparte un hallazgo con un invitado externo", "Retests automáticos para hallazgos de código"]
        image: "finding"
        height: 1280
        screen: "Vulnerabilities"
        alt: "Un hallazgo crítico en LESIS: pasa de Identified a Fixing y después muestra evidencia, impacto, recomendación, historial de estados y la conversación entre la analista de LESIS, la líder de seguridad y el ingeniero."
      - label: "Seguridad de código"
        title: "Revisión de código que tiene que probarlo."
        text: "Conecta GitHub, GitLab o Bitbucket con acceso de solo lectura. La IA mapea cada aplicación, sigue los datos hasta donde se usan y reporta solo lo que una segunda revisión, más fuerte, confirma. Los secretos se evalúan sin leer nunca su valor."
        points: ["Conexiones de solo lectura, siempre sincronizadas", "Revisión de código con IA, verificada antes de reportar", "Búsqueda de secretos que nunca ve el valor", "Solo se vuelve a leer lo que cambió"]
        image: "repositories"
        height: 900
        screen: "Code repositories"
        alt: "Repositorios de código en LESIS: al abrir payments-api aparecen la búsqueda de secretos y la revisión de código con IA, donde cinco posibles vulnerabilidades pasaron por una segunda revisión y una se confirmó, y después los hallazgos vinculados."
      - label: "Cadenas de explotación y causas raíz"
        title: "Mira cómo los hallazgos se vuelven ataques reales."
        text: "La IA encadena hallazgos abiertos en caminos de ataque y los agrupa por la corrección que comparten. Los analistas editan, agregan o descartan cada paso, y cada cambio queda marcado con quién lo hizo."
        points: ["Caminos de ataque entre hallazgos y activos", "Causas raíz que cierran varios hallazgos a la vez", "Pasos editados o creados por personas, señalados", "Modo presentación y exportación en YAML"]
        image: "exploit-chains"
        height: 950
        screen: "Exploit chains"
        alt: "Cadenas de explotación en LESIS: al seleccionar un camino de ataque que va del control del admin del comercio a los datos de tarjeta, se resalta en el grafo; un paso muestra desde dónde se alcanza y adónde lleva; y el camino se abre con sus siete pasos y evidencias."
      - label: "Superficie de ataque"
        title: "Cada activo, cada repositorio y cómo se conectan."
        text: "Un inventario de lo que tienes y de dónde vive el código, dibujado como un grafo con los hallazgos abiertos en cada recurso. Los sistemas expuestos a internet quedan marcados, y los vínculos que registras se separan de los que deduce el análisis."
        points: ["Activos y repositorios, vinculados", "Hallazgos abiertos en cada recurso", "Sistemas expuestos a internet marcados", "Vínculos registrados y deducidos, separados"]
        image: "resource-graph"
        height: 1000
        screen: "Resource graph"
        alt: "El grafo de recursos de LESIS en uso: al seleccionar el gateway de pagos aparecen su entorno, criticidad y conexiones; con las vulnerabilidades como nodos, una vinculada al gateway se abre como hallazgo, con su evidencia."
      - label: "Conocimiento"
        title: "Tus políticas y threat models, vinculados al trabajo."
        text: "Políticas, procedimientos, playbooks, runbooks y threat models viven junto a los hallazgos que explican. Menciona un hallazgo, activo, repositorio o investigación y queda vinculado al documento. Los árboles de ataque se dibujan en la propia página y pueden presentarse o exportarse."
        points: ["Políticas, procedimientos, playbooks, runbooks y threat models", "Menciones que vinculan hallazgos, activos y repositorios", "Árboles de ataque dibujados en el documento", "Búsqueda en lenguaje simple en todos los documentos"]
        image: "knowledge"
        height: 1300
        screen: "Knowledge"
        alt: "Un threat model en el Knowledge de LESIS: al pasar el cursor sobre los activos y hallazgos mencionados aparece una vista previa de cada uno, con severidad, estado y una descripción breve."
      - label: "Tu asesor"
        title: "Un ingeniero con nombre, a un clic."
        text: "Tu organización tiene un asesor de LESIS dentro de la plataforma: un ingeniero de seguridad que conoce tus sistemas, revisa lo que propone la IA y se suma a tu equipo cuando una corrección necesita otro par de ojos. Escríbele o agenda una llamada sin salir de LESIS."
        points: ["Un ingeniero de LESIS con nombre, dedicado a tu organización", "Perfil, correo y enlace de agenda en la app", "Revisa propuestas de la IA y correcciones con tu equipo", "Junto al asistente, en la pantalla de inicio"]
        image: "advisor"
        height: 900
        screen: "Home"
        alt: "La pantalla de inicio de LESIS: al seleccionar a la asesora de la organización, su perfil se abre al lado, con bio, correo y opciones de agenda."

  ai:
    eyebrow: "IA con salvaguardas"
    title: "IA que tiene que probarlo <br>antes de avisarte."
    intro: >-
      Toda función de IA en LESIS sigue las mismas reglas. Por ellas una lista corta de hallazgos merece confianza, y la IA nunca se vuelve el lugar donde se toma una decisión.
    items:
      - title: "Prueba antes del hallazgo"
        text: "Una sospecha se vuelve hallazgo solo cuando todas las revisiones confirman cómo llega un atacante. Las de severidad alta y crítica se revisan dos veces."
      - title: "Nunca ve un secreto"
        text: "Las credenciales candidatas se evalúan por el código que las rodea. El valor queda enmascarado en pantalla y se elimina antes de que el código llegue a un modelo."
      - title: "Costo de IA a la vista"
        text: "Tokens y costo estimado de cada función de IA, por organización y modelo, para que el uso nunca sea una sorpresa."
      - title: "La IA propone, las personas deciden"
        text: "Cadenas de explotación, causas raíz y registros sugeridos quedan como borrador hasta que un analista los confirme, edite o descarte, y cada cambio muestra quién lo hizo."
      - title: "Prueba de la corrección también"
        text: "Cuando un hallazgo de código pasa a Retest, la IA lo verifica contra el código actual y publica el resultado en el propio hallazgo."

  api:
    eyebrow: "API"
    title: "Tu programa, programable."
    intro: >-
      Una API REST documentada cubre la plataforma, para que los hallazgos fluyan a tus tickets, tu SIEM y tu data warehouse, y para que tus propios agentes de IA trabajen con los mismos registros que ve tu equipo, con los mismos permisos.
    points: ["Una API REST documentada para cada módulo", "Claves vinculadas a una organización y a los permisos de su dueño", "Alcances de lectura y escritura, vencimiento y revocación", "Una guía para agentes de IA, descargable en Markdown"]
    soon_label: "Próximamente"
    soon_tag: "Pronto"
    soon:
      - title: "LESIS CLI"
        text: "Consulta y actualiza tu programa desde la terminal y tus pipelines de CI."
      - title: "Servidor MCP de LESIS"
        text: "Da a tus asistentes de IA y agentes de código acceso gobernado a tus hallazgos, dentro de los permisos de la clave."
    code_title: "Listar hallazgos críticos y altos fuera de SLA"
    code_label: "Ejemplo de solicitud a la API que lista hallazgos críticos y altos fuera de SLA, y su respuesta en JSON."

  enterprise:
    eyebrow: "Enterprise"
    title: "Hecha para organizaciones <br>con más de uno de todo."
    intro: >-
      Subsidiarias, unidades de negocio, investigadores externos y auditores, cada uno con exactamente el acceso que necesita, y un registro de todo lo que hicieron.
    items:
      - title: "Multiorganización"
        text: "Opera cada unidad de negocio o subsidiaria como su propia organización, con sus plazos, y míralas todas juntas cuando lo necesites."
      - title: "Roles que reflejan tu forma de trabajar"
        text: "Ocho roles, de administrador a analista, remediador e invitado. El servidor garantiza cada uno de ellos."
      - title: "Pista de auditoría completa"
        text: "Cada escritura en cada módulo, registrada con la cuenta que la hizo y cuándo."
      - title: "Acceso para invitados"
        text: "Comparte un solo hallazgo o investigación con un invitado externo, solo lectura, sin abrir el resto del programa."
      - title: "Benchmark"
        text: "Métricas de remediación comparadas con organizaciones similares en la plataforma, sin nombrar a ninguna."
      - title: "El valor del programa"
        text: "Cuánto vale lo que encontró tu programa, calculado a partir del valor que tu organización asigna a cada severidad."
      - title: "Inicio de sesión en dos pasos"
        text: "Contraseña y código de un solo uso, con cuentas nuevas aprobadas por un administrador antes de poder entrar."
      - title: "Mínimo privilegio en tu código"
        text: "Acceso de solo lectura a los repositorios, tokens de escaneo limitados a un repositorio y credenciales guardadas cifradas."
      - title: "Plazos que tú defines"
        text: "Ventanas de corrección por severidad en cada organización, con cada hallazgo vencido señalado antes de que alguien pregunte."

  people:
    eyebrow: "Especialistas disponibles"
    display: "Ingenieros detrás de cada hallazgo."
    text: >-
      LESIS está construida y respaldada por un laboratorio de investigación en seguridad. Tu organización tiene un asesor de LESIS con nombre, y los mismos ingenieros revisan lo que la IA propone, hacen el triaje de lo que envían investigadores externos y conducen evaluaciones más profundas cuando un sistema lo necesita.
    items:
      - title: "Tu asesor"
        text: "Un ingeniero de LESIS con nombre, dedicado a tu organización, accesible desde la plataforma y que conoce tu contexto."
      - title: "Decisiones que la IA no toma"
        text: "Los analistas confirman o descartan lo que la IA propone, y prueban lo que la revisión de código no alcanza."
      - title: "Triaje de la divulgación"
        text: "Cada reporte de un investigador externo pasa por el triaje de LESIS antes de llegar a tu equipo."
      - title: "Evaluaciones"
        text: "Investigación de vulnerabilidades, revisión de arquitectura e investigación de incidentes, con cada hallazgo entrando en el mismo registro."

  ways:
    title: "Formas de usar LESIS"
    intro: >-
      Usa la plataforma con tu propio equipo, o deja que LESIS opere tu programa en ella, junto contigo. En ambos casos el registro es tuyo, y los ingenieros detrás de él son los mismos.
    platform:
      title: "Plataforma"
      lead:
        - "Tu equipo opera el programa en LESIS."
        - >-
          Todas las capacidades para tu organización: postura y analítica, gestión de vulnerabilidades, seguridad de código, cadenas de explotación y causas raíz, superficie de ataque y conocimiento. La IA hace la lectura, y tu asesor de LESIS está cerca cuando una decisión necesita una segunda opinión.
    managed:
      title: "Gestionado"
      lead:
        - "LESIS opera tu programa de seguridad en la plataforma, junto a tu equipo."
        - >-
          Hallazgos triados, perseguidos, vueltos a probar y cerrados. Reportes de divulgación triados a medida que llegan. Inventario, runbooks y políticas al día; campañas de concientización y capacitaciones llevadas hasta el final; el trust center siempre listo; la postura reportada frente a organizaciones comparables. Lo que aportas no es headcount sino acceso: tus ingenieros actúan cuando actuar importa, y lo que aprenden entra en el registro mientras trabajan.
    partners: >-
      Las consultoras pueden entregar LESIS con su propia marca, o referirnos clientes, a través del <a href="{partnership_url}">Programa de Partners de LESIS</a>, sin armar un equipo interno.

  record:
    eyebrow: "Trayectoria"
    title: "Ingenieros que puedes verificar"
    intro: >-
      El criterio en LESIS viene de personas con un historial público: divulgaciones de vulnerabilidades, experiencia dentro de grandes empresas de tecnología y contribuciones a la comunidad de seguridad a través de competencias y charlas en conferencias.
    items:
      - title: "Vulnerabilidades publicadas"
        text: >-
          Miembros de nuestro equipo han reportado vulnerabilidades a D-Link, documentadas en <a href="https://nvd.nist.gov/vuln/detail/CVE-2020-9376" target="_blank" rel="noopener noreferrer">CVE-2020-9376</a> y <a href="https://nvd.nist.gov/vuln/detail/CVE-2020-9377" target="_blank" rel="noopener noreferrer">CVE-2020-9377</a>, y a MISP, registrada como <a href="https://nvd.nist.gov/vuln/detail/CVE-2020-28043" target="_blank" rel="noopener noreferrer">CVE-2020-28043</a>. Su trabajo también incluye reportes a Oracle y Apple, con registros públicos en el <a href="https://www.oracle.com/security-alerts/cpujul2022.html" target="_blank" rel="noopener noreferrer">Critical Patch Update de julio de 2022 de Oracle</a> y en los <a href="https://support.apple.com/en-gb/102774" target="_blank" rel="noopener noreferrer">agradecimientos de seguridad de servidores web de Apple</a>.
      - title: "Participación en competencias CTF"
        text: >-
          Miembros de nuestro equipo han competido en eventos Capture The Flag, obteniendo el primer lugar en el CTF de BSides São Paulo y ganando una etapa clasificatoria de Hackaflag. LESIS también apoya equipos de la comunidad: en <a href="https://www.sbseg2026.uff.br/" target="_blank" rel="noopener noreferrer">SBSeg 2026</a>, el equipo GRIS/UFRJ, con el apoyo de LESIS, <a href="{bulletin_url}">quedó en primer lugar entre 18 equipos</a> en desafíos de análisis de tráfico, forense e investigación de incidentes.
      - title: "Experiencia en líderes del mercado"
        text: >-
          Nuestro equipo incluye ingenieros que han trabajado en empresas como Nubank, el mayor banco digital de América Latina, y Globo, la mayor empresa de medios de Brasil, así como en los principales proveedores de ciberseguridad de Brasil y en otras empresas igual de sólidas, aunque menos conocidas. Aportan a su trabajo en LESIS la experiencia con las exigencias de ingeniería de sistemas que atienden a millones de personas.
      - title: "Charlas en eventos de seguridad"
        text: >-
          Miembros de nuestro equipo han dado charlas en eventos como BxSec, Roadsec, BSides Rio de Janeiro y XibéSec. Estas contribuciones llevan la experiencia de nuestro equipo a discusiones con otros profesionales de seguridad y ayudan a compartir conocimiento en la comunidad de seguridad de Brasil.

  work:
    transition: "Explora nuestras investigaciones publicadas y herramientas de código abierto."
    tool: "Herramienta de código abierto"
    no_release: "Sin versión publicada"
    tools:
      security_gate: "Aplica umbrales de seguridad configurables a las alertas de GitHub para que tu equipo pueda exigir verificaciones en su pipeline de CI/CD."
      bunkai: "Examina las dependencias de proyectos Perl en busca de módulos desactualizados y vulnerabilidades conocidas, con resultados que se integran a los flujos de desarrollo."
      kasumi: "Extrae y busca mensajes de Slack por palabra clave y rango de fechas para apoyar evaluaciones de seguridad autorizadas."
    all_publications: "Todas las publicaciones &rarr;"
    explore_tools: "Explora nuestras herramientas &rarr;"

  closing:
    title: ["Una plataforma", "para todo el programa.", "Mírala en el tuyo."]
    text: >-
      En la demo te mostramos la plataforma con una organización ficticia y luego hablamos de la tuya: qué operas, quién lo cuida y dónde están hoy tus hallazgos.

