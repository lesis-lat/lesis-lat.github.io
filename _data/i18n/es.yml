# --- Home page ----------------------------------------------------------------
home:
  hero:
    title: "Ciberseguridad a la medida <br>de tu misión."
    lead: >-
      LESIS es un aliado, no un producto. Somos un equipo de ingeniería de seguridad que trabaja de cerca con cada cliente y define el alcance, el método y las herramientas en función del sistema en cuestión. No hay dos proyectos iguales.
    see_how: "Mira cómo trabajamos"
    cards:
      - label: "Hallazgo &middot; VUL-0417"
        title: "Toma de control de cuentas vía XSS almacenado"
        meta: ["Severidad crítica, en corrección", "Vence en 2 días", "Vinculado a portal.example.com"]
        badge: "Crítica"
      - label: "Investigación &middot; INV-0042"
        title: "Acciones de administrador sin explicación en el log de auditoría"
        meta: ["Severidad alta, en investigación", "Punto de entrada reproducido, evidencia adjunta", "Vinculada a 2 hallazgos y a la consola de administración"]
        badge: "Alta"
        note: "Línea de tiempo abierta"
      - label: "I+D &middot; TOOL-0031"
        title: "Fuzzer a la medida para la API de socios"
        meta: ["4,2 millones de casos en 19 horas", "3 crashes analizados, 1 reproducible", "Registrado como VUL-0429, crítica"]
        badge: "Fuzzing"

  clients:
    label: "Organizaciones a las que LESIS ha reportado vulnerabilidades"
    title: "A quiénes hemos ayudado a proteger"
    empty: "Fintechs, retail, salud, telecomunicaciones y lawtechs"

  what:
    eyebrow: "Tu aliado de I+D en seguridad"
    display: "El futuro de internet todavía no está escrito. Estamos aquí para asegurarnos de que el próximo capítulo se escriba de forma segura."
    text:
      - >-
        Nuestro enfoque parte de una perspectiva rigurosa de atacante y de un pensamiento guiado por la investigación. Entendemos lo que cada organización necesita y nos adaptamos a requisitos que cambian de una a otra, para que la inversión en seguridad se convierta en un diferencial para el negocio y se preserven las inversiones ya hechas. LESIS trabaja con fintechs, retail, salud, telecomunicaciones y lawtechs.
      - >-
        Como institución independiente, sin vínculos con otras empresas ni inversionistas, somos neutrales al evaluar productos y tecnología, y nuestro trabajo se juzga solo por su calidad. Nuestros consultores tienen más de diez años de experiencia y han reportado vulnerabilidades a D-Link (CVE-2020-9376 y CVE-2020-9377), Apple, Activision, Oracle y MISP (CVE-2020-28043).

  execution:
    eyebrow: "Cómo ejecutamos"
    display: "La seguridad no es lineal. Nuestra ejecución tampoco."
    text: >-
      En el modelo tradicional, un solo analista conduce toda la evaluación. LESIS lleva cada proyecto como un esfuerzo colaborativo, con varios especialistas trabajando sobre el mismo sistema al mismo tiempo, cada uno con una formación distinta.
    items:
      - title: "Mayor cobertura técnica"
        text: "Más componentes examinados, y más de una forma de examinar cada uno."
      - title: "Menos sesgos individuales"
        text: "Ningún supuesto sobre el sistema queda sin cuestionar."
      - title: "Validación cruzada de hallazgos"
        text: "Más de un ingeniero confirma cada vulnerabilidad antes de registrarla."
      - title: "Escenarios más profundos"
        text: "Tiempo para seguir una cadena de debilidades hasta lo que realmente expone."

  engineering:
    eyebrow: "Qué hacemos"
    title: "Seguimos los problemas de seguridad del diseño al código y a la ejecución."
    intro: >-
      Seguridad de aplicaciones, revisión de arquitectura y seguridad de la cadena de suministro de software, apoyadas en análisis estático, fuzzing, ingeniería inversa y desarrollo de exploits. Reunimos estas disciplinas para investigar tu sistema.
    items:
      - title: "Revisar el diseño del sistema"
        text: "Mapear los límites de confianza, revisar la arquitectura y evaluar los controles de seguridad para entender cómo las decisiones de diseño afectan la exposición del sistema a ataques."
      - title: "Investigar cómo puede fallar"
        text: "Combinar pentesting, revisión de código, análisis estático e ingeniería inversa para encontrar debilidades, y luego desarrollar exploits para verificar cómo pueden usarse y establecer su impacto."
      - title: "Construir herramientas para ir más a fondo"
        text: "Construir harnesses de fuzzing, analizadores a la medida e instrumentación para alcanzar rutas de código complejas, examinar el comportamiento en tiempo de ejecución e investigar debilidades que requieren una mirada más cercana."

  journey:
    eyebrow: "Cómo se desarrolla un proyecto"
    title: "Entender el sistema. Dejar a tu equipo más fuerte."
    intro: >-
      Trabajamos con tus ingenieros para convertir una pregunta de seguridad en un resultado que puedan usar: un diseño, una decisión técnica, un hallazgo de investigación o una herramienta funcionando. Los métodos y los entregables siguen al problema. A lo largo del proyecto, construimos el entendimiento que tu equipo necesita para llevar el trabajo adelante.
    steps:
      - label: "Contexto"
        title: "Entender el contexto"
        text: >-
          Estudiar los sistemas, los flujos de trabajo y los requisitos de los que depende el trabajo. Examinamos la investigación existente y los enfoques disponibles, identificamos supuestos y establecemos qué preguntas requieren más investigación.
        toolbar: "Contexto &middot; mapa del sistema"
