# --- Partnership ----------------------------------------------------------------
partnership:
  eyebrow: "Programa de Alianzas"
  title: "Amplía tus capacidades de ciberseguridad con LESIS."
  lead:
    - "El Programa de Alianzas de LESIS permite a las empresas incorporar servicios especializados de ciberseguridad a su portafolio sin necesidad de armar un equipo de seguridad interno ni invertir en infraestructura adicional."
    - "A través de modelos de colaboración flexibles, los socios pueden ofrecer los servicios de LESIS con su propia marca, combinar nuestra experiencia con las soluciones que ya ofrecen o referir clientes que necesitan apoyo especializado en seguridad."
  become: "Conviértete en socio"
  subject: "Alianza"
  levels_link: "Niveles de alianza"
  benefits:
    title: "Beneficios"
    intro: "Un socio suma nuestros ingenieros, nuestra investigación y nuestra plataforma a lo que ya ofrece, y conserva la relación con el cliente."
    items:
      - title: "Experiencia especializada"
        text: "Accede a investigadores y consultores de seguridad con experiencia para apoyar proyectos complejos y críticos."
      - title: "Portafolio ampliado"
        text: "Suma evaluaciones de seguridad, investigación de vulnerabilidades, consultoría y herramientas a la medida a lo que ya ofreces."
      - title: "Modelos flexibles"
        text: "Elige entre entrega white-label, alianzas de referidos u ofertas de servicio integradas."
      - title: "Sin infraestructura adicional"
        text: "Amplía tus capacidades de ciberseguridad sin crear ni mantener un equipo especializado interno."
      - title: "Soporte técnico y comercial"
        text: "Recibe apoyo en la evaluación de oportunidades, la definición del alcance, la elaboración de propuestas y la entrega técnica."
      - title: "Soluciones personalizadas"
        text: "Combina los servicios de LESIS con tus propias capacidades para crear ofertas a la medida de cada cliente."
  levels:
    title: "Niveles de alianza"
    intro: "El programa se estructura en cuatro niveles, según el compromiso, las oportunidades de negocio y la colaboración de cada socio con LESIS."
    items:
      - name: "Bronce"
        text:
          - "El nivel de entrada para las empresas que comienzan su alianza con LESIS."
          - "Incluye acceso a los materiales estándar de la alianza, una presentación de los servicios de LESIS y apoyo durante el proceso de venta inicial."
      - name: "Plata"
        text:
          - "Pensado para socios que desarrollan oportunidades recurrentes con LESIS."
          - "Incluye todos los beneficios del nivel Bronce, apoyo comercial adicional y la participación de LESIS en reuniones seleccionadas con clientes."
      - name: "Oro"
        text:
          - "Para socios consolidados que trabajan de cerca con LESIS en oportunidades de ciberseguridad."
          - "Incluye todos los beneficios de los niveles anteriores, soporte técnico ampliado y la posibilidad de desarrollar contenido co-branded e iniciativas conjuntas."
      - name: "Platino"
        text:
          - "El nivel más alto de la alianza, pensado para relaciones estratégicas y de largo plazo."
          - "Incluye todos los beneficios de los niveles anteriores, soporte prioritario, una colaboración más cercana con el equipo de LESIS, acceso a iniciativas seleccionadas y oportunidades de visibilidad conjunta en eventos y campañas de co-marketing."
    note: "Los niveles de alianza y los criterios de elegibilidad se evalúan de forma individual, según el perfil, el compromiso y la relación del socio con LESIS."
  closing:
    title: ["Construye ofertas", "de seguridad más sólidas", "con LESIS."]
    text: "Ya sea que quieras ampliar tu portafolio de servicios, entregar proyectos de ciberseguridad con tu propia marca o conectar a tus clientes con experiencia especializada en seguridad, podemos ayudarte a definir el modelo de alianza adecuado."
    button: "Conviértete en socio de LESIS"

# --- Nosotros: /es/about/ -------------------------------------------------------
about:
  hero:
    eyebrow: "Sovereign AI Lab for Cybersecurity"
    title: ["Investigación independiente.", "Inteligencia soberana.", "Capacidades cibernéticas avanzadas."]
    identity: "Un laboratorio de IA independiente y soberano, enfocado en ciberseguridad."
    lead: "Investigamos y desarrollamos capacidades de IA soberana que permiten a organizaciones y gobiernos poseer, operar y hacer evolucionar su propia inteligencia cibernética."
    thesis_link: "Lee la tesis"
  origin:
    eyebrow: "01 &middot; De dónde venimos"
    title: "Todo empezó con investigación."
    quote: "We are an applied security research firm, focused on developing effective offensive technology to support critical operations."
    source: "lesis.lat, mayo de 2024. La primera frase que publicamos."
    text: >-
      LESIS fue fundada por investigadores que construían sus propios fuzzers, analizadores y exploits para responder lo que los escáneres comerciales no podían. Primero la investigación nunca fue un eslogan para nosotros. Cuando el instrumento que necesitábamos no existía, construirlo era el trabajo.
  shift:
    eyebrow: "02 &middot; Qué cambió"
    title: "Entonces cambió el instrumento."
    text:
      - >-
        Los modelos de lenguaje se volvieron el instrumento más poderoso que ha tenido la investigación en seguridad. Leen código a una escala que ningún equipo alcanza, y los más fuertes ya encuentran vulnerabilidades ocultas durante décadas.
      - >-
        Aun así, casi todos los usan de la misma forma: alquilados a un puñado de laboratorios, en las condiciones que esos laboratorios fijan, con código e incidentes enviados adonde corra el modelo. Un laboratorio que solo puede alquilar su inteligencia depende de quien es su dueño, y lo mismo vale para todos los que dependen de ese laboratorio.
    stages:
      - when: "Dónde empezamos"
        title: "Investigación aplicada en seguridad"
        text: "Investigación ofensiva, ingeniería inversa y herramientas construidas para operaciones críticas."
      - when: "Hoy"
        title: "La investigación se encuentra con la IA"
        text: "Una plataforma para todo el programa de seguridad, con acceso a los modelos de frontera en ciber de Anthropic y OpenAI."
      - when: "Hacia dónde vamos"
        title: "Un laboratorio de IA soberana"
        text: "Las capacidades que construimos para nosotros, operadas por las organizaciones que necesitan las suyas."
  thesis:
    eyebrow: "03 &middot; En qué creemos"
    display: "La ciberseguridad exige una inteligencia que las organizaciones puedan entender, controlar y en la que puedan confiar."
    items:
      - title: "Entender"
        text: "Cada resultado trae su evidencia, y cada paso con el que contribuye un modelo queda marcado como del modelo. Una persona siempre puede ver qué se encontró, cómo y quién lo hizo."
      - title: "Controlar"
        text: "Los modelos, los datos y la infraestructura responden a la organización que depende de ellos, no a quien vende el acceso. Sin eso, ninguna decisión de seguridad es del todo suya."
      - title: "Confiar"
        text: "La confianza viene de la prueba, no de la fluidez. Un modelo puede proponer, pero un hallazgo solo cuenta una vez verificado, y una persona responde por él."
  sovereignty:
    eyebrow: "04 &middot; Qué significa soberanía"
    title: "Independencia que se puede comprobar."
    intro: "La soberanía es control sobre los modelos, los datos, la infraestructura, la propiedad intelectual y la forma en que evolucionan las capacidades de IA. No exige un foundation model creado desde cero, pero el control tiene que ser real. Aquí es donde estamos."
    today_label: "Hoy"
    building_label: "Construyendo"
    items:
      - name: "Modelos"
        today: "Agnósticos por diseño. LESIS corre modelos cerrados, como Claude y GPT, y modelos open-weight, como DeepSeek y GLM. Tú eliges cuál se ocupa de cada tarea; el control es tuyo."
        building: "Modelos especializados en trabajo de seguridad, adaptados a partir de modelos open-weight y medidos contra nuestra propia investigación."
      - name: "Datos"
        today: "Los valores de los secretos se enmascaran antes de que cualquier modelo los vea, los repositorios se conectan solo en lectura, y cada llamada a un modelo queda registrada con el modelo, la tarea y el costo."
        building: "Pipelines que mantienen el material sensible dentro de su propio entorno, para que solo salga lo que la organización apruebe."
      - name: "Infraestructura"
        today: "La plataforma se distribuye como una imagen de contenedor portátil, y una instalación completa en la nube, de la red a los backups, está escrita como código y puede levantarse en otra cuenta."
        building: "Inferencia en infraestructura que LESIS controla o en la de la propia organización, incluidas redes aisladas de internet."
      - name: "Propiedad intelectual"
        today: "La plataforma, sus analizadores y nuestros métodos se desarrollan internamente, así que lo que aprende el laboratorio se queda en el laboratorio y no en un proveedor."
        building: "Datasets creados a partir de nuestra propia investigación, la materia prima de la que están hechos los modelos especializados."
      - name: "Evolución"
        today: "Cada vez que un analista confirma o descarta un resultado de la IA, queda registrado, lo que nos da una medida continua de dónde acierta cada modelo y dónde no."
        building: "Un ciclo de evaluar, adaptar y volver a desplegar modelos al ritmo de nuestros clientes, no según el calendario de lanzamientos de un proveedor."
  agenda:
    eyebrow: "05 &middot; Dónde la aplicamos"
    title: "Solo ciberseguridad."
    intro: "Un modelo formado por hallazgos, exploits y correcciones reales es un instrumento distinto de uno formado por la internet abierta. Por eso el laboratorio trabaja en seguridad y en nada más."
    items:
      - title: "Seguridad ofensiva"
        text: "Modelos y herramientas que encuentran y encadenan vulnerabilidades, llevan los fuzzers a caminos que otros no alcanzan y validan exploits en condiciones controladas."
      - title: "Defensa"
        text: "Revisión de código, causas raíz que cierran varios hallazgos a la vez y retests que confirman que una corrección sigue en pie tras cada cambio."
      - title: "Inteligencia cibernética"
        text: "Hallazgos, activos, incidentes y rutas de ataque reunidos en un único panorama de exposición sobre el que la organización puede actuar."
      - title: "Evaluación"
        text: "Benchmarks y conjuntos de prueba para tareas de seguridad, para que cada modelo que usamos o construimos se mida en el trabajo que debe hacer."
  record:
    eyebrow: "06 &middot; Por qué confiar"
    title: "Investigación que se puede verificar."
    items:
      - title: "Divulgación de vulnerabilidades"
        text: '<a href="https://nvd.nist.gov/vuln/detail/CVE-2020-9376" target="_blank" rel="noopener noreferrer">CVE-2020-9376</a> y <a href="https://nvd.nist.gov/vuln/detail/CVE-2020-9377" target="_blank" rel="noopener noreferrer">CVE-2020-9377</a> en D-Link, <a href="https://nvd.nist.gov/vuln/detail/CVE-2020-28043" target="_blank" rel="noopener noreferrer">CVE-2020-28043</a> en MISP, y reportes reconocidos por <a href="https://www.oracle.com/security-alerts/cpujul2022.html" target="_blank" rel="noopener noreferrer">Oracle</a> y <a href="https://support.apple.com/en-gb/102774" target="_blank" rel="noopener noreferrer">Apple</a>.'
      - title: "Competencias"
        text: 'Primer lugar en el CTF de BSides São Paulo, una eliminatoria de Hackaflag ganada, y el equipo GRIS/UFRJ, apoyado por LESIS, <a href="{bulletin_url}">primero entre 18</a> en SBSeg 2026.'
      - title: "Open source"
        text: '<a href="https://github.com/lesis-lat/security-gate" target="_blank" rel="noopener noreferrer">Security Gate</a>, <a href="https://github.com/lesis-lat/bunkai" target="_blank" rel="noopener noreferrer">Bunkai</a> y <a href="https://github.com/lesis-lat/kasumi" target="_blank" rel="noopener noreferrer">Kasumi</a>, herramientas que el equipo construye y mantiene abiertas, para que cualquiera las use y audite.'
      - title: "Charlas"
        text: "Investigación presentada en BxSec, Roadsec, BSides Rio de Janeiro y XibéSec, y compartida con la comunidad brasileña de seguridad."
  closing:
    title: ["Tu infraestructura.", "Tu inteligencia.", "Tu soberanía."]
    text: "Para empresas, servicios críticos y gobiernos que no pueden entregar su código, sus incidentes o su inteligencia a un tercero, y que no deberían tener que renunciar a la IA moderna para protegerlos."
    research: "Lee nuestra investigación"
    signoff: "Sovereign Intelligence. Secure Futures."

# --- Modelos de frontera: /mythos/, /daybreak/, /frontier-models/ -------------
frontier:
  request: "Solicitar acceso"
  how_link: "Cómo funciona"
  stats_eyebrow: "Las cifras"
  access_eyebrow: "Acceso"
  sources_title: "Fuentes"
  note: "Claude Mythos es desarrollado por Anthropic y Daybreak es un programa de OpenAI. Sus nombres aparecen aquí solo para describir el acceso que ofrece LESIS. Las cifras son las publicadas por Anthropic y OpenAI o reportadas por la prensa."
  how:
    eyebrow: "Cómo lo opera LESIS"
    title: "Tú recibes los hallazgos. <br>Nosotros nos ocupamos del modelo."
    intro: >-
      El acceso, el alcance, la capacidad de cómputo y los ingenieros que revisan cada resultado los pone LESIS. Lo que llega a tu equipo es una lista corta de vulnerabilidades probadas, cada una con una forma de corregirla.
    steps:
      - title: "Alcance y autorización"
        text: "Acordamos qué entra en el alcance, de repositorios a aplicaciones e infraestructura, con la autorización por escrito que estos programas exigen. Nada corre fuera de él."
      - title: "La IA encuentra, LESIS prueba"
        text: "El modelo lee tu código y tus sistemas como lo haría un atacante. Los ingenieros de LESIS reproducen cada resultado antes de que cuente, así que recibes vulnerabilidades, no sospechas."
      - title: "Directo a tu registro"
        text: "Cada hallazgo probado entra en la plataforma LESIS con su evidencia, severidad, un responsable y un plazo, junto al resto de tu programa."
      - title: "Corregido y vuelto a probar"
        text: "Cuando tu equipo publica la corrección, volvemos a correr la verificación y solo cerramos el hallazgo cuando la brecha ya no existe."
  pages:
    mythos:
      subject: "Acceso a Mythos"
      eyebrow: "Claude Mythos, operado por LESIS"
      title: "Tu camino a Mythos."
      lead:
        - "Anthropic creó un modelo que encuentra y explota vulnerabilidades por sí solo, y decidió que el público no debía tenerlo. Claude Mythos está reservado a las empresas detrás del software crítico del mundo y a un grupo pequeño de organizaciones de seguridad verificadas."
        - "LESIS es una de esas organizaciones, verificada por Anthropic en su Cyber Verification Program. Corremos Mythos sobre tu código y tus sistemas, probamos lo que encuentra y le entregamos las correcciones a tu equipo."
      stats:
        - value: "Miles"
          text: "de zero-days de alta severidad encontrados en pocas semanas, en todos los grandes sistemas operativos y navegadores."
        - value: "27 años"
          text: "pasó inadvertida una falla que permitía tumbar cualquier máquina OpenBSD, hasta que Mythos leyó el código."
        - value: "5 millones"
          text: "de veces pasaron las pruebas automatizadas por la línea de FFmpeg que escondía un bug de 16 años encontrado por Mythos."
        - value: "83,1%"
          text: "en reproducción de vulnerabilidades de CyberGym, frente al 66,6% de Claude Opus 4.6."
      speech:
        eyebrow: "Por qué importa"
        display: "Cada línea de código que alguna vez publicaste está a punto de ser leída por algo que nunca se cansa."
        text:
          - >-
            En pocas semanas, Mythos encontró miles de vulnerabilidades de alta severidad en todos los grandes sistemas operativos y navegadores. Una falla en OpenBSD, de 27 años, que dejaba a cualquiera tumbar una máquina solo con conectarse a ella. Un bug en FFmpeg, de 16 años, en una línea que las pruebas automatizadas habían ejecutado cinco millones de veces. Bugs del kernel de Linux encadenados desde un usuario común hasta el control total de la máquina. Casi todo sin ningún humano guiándolo.
          - >-
            Ninguno de esos bugs era nuevo. Lo que cambió fue el costo de encontrarlos. Una capacidad así no se queda mucho tiempo en un solo laboratorio, y cuando llegue a los atacantes, el tiempo entre una falla y su exploit se reduce a horas. Las organizaciones que salgan bien paradas serán aquellas cuyo código un modelo así leyó primero, de su lado.
      access:
        title: "Por qué no basta con registrarse."
        text: >-
          Anthropic no vende Mythos al público. Da acceso a los socios de Project Glasswing, las empresas que construyen y mantienen software crítico, y a organizaciones de seguridad verificadas a través de su Cyber Verification Program, con reglas sobre cómo se usa el modelo. LESIS pasó por esa verificación, así que recibes lo que encuentra Mythos sin postularte, esperar una aprobación ni armar un equipo para operarlo.
      closing:
        title: ["Deja que Mythos lea tu código", "antes de que lo haga", "el modelo de otro."]
        text: "Cuéntanos qué operas. Te diremos por dónde debe empezar Mythos y en cuánto tiempo puede correr."
    daybreak:
      subject: "Acceso a Daybreak"
      eyebrow: "OpenAI Daybreak, operado por LESIS"
      title: "Tu camino a Daybreak."
      lead:
        - "OpenAI ahora dedica una parte significativa de su cómputo de frontera a encontrar y corregir vulnerabilidades, y reserva los modelos que lo hacen para defensores aprobados. Daybreak es la forma en que esos defensores llegan a ellos."
        - "LESIS está verificada por OpenAI para Daybreak. Apuntamos esos modelos a tu código y tus sistemas, probamos lo que encuentran y le entregamos las correcciones a tu equipo."
      stats:
        - value: "948"
          text: "posibles problemas en el kernel de Linux, cada uno con una corrección ya preparada."
        - value: "81"
          text: "vulnerabilidades nuevas encontradas en Firefox."
        - value: "2 niveles"
          text: "Daybreak Blue para descubrimiento y respuesta; Daybreak Red para modelos entrenados en ciberseguridad y validación de exploits."
        - value: "US$ 1.000 millones"
          text: "comprometidos por OpenAI con quienes defienden infraestructura crítica."
      speech:
        eyebrow: "Por qué importa"
        display: "El cómputo de frontera ya apunta a las vulnerabilidades. La única pregunta es quién lo apunta primero a las tuyas."
        text:
          - >-
            Daybreak da a defensores aprobados los modelos más capaces de OpenAI, con salvaguardas ajustadas para el trabajo de seguridad. Daybreak Blue es para descubrimiento y respuesta a incidentes. Daybreak Red suma modelos entrenados en ciberseguridad, hechos para investigación de vulnerabilidades y validación de exploits. Apuntados al kernel de Linux, prepararon correcciones para 948 posibles problemas. Apuntados a Firefox, encontraron 81 vulnerabilidades nuevas.
          - >-
            El objetivo declarado de OpenAI es poner inteligencia de frontera en manos de defensores de confianza antes de que los atacantes puedan usar IA ofensiva a escala, y llama al tiempo que queda para hacerlo una ventana que se está cerrando. Los bugs que encuentran estos modelos ya están en tu código. Alguien lo va a leer con un modelo así. Que seas tú.
      access:
        title: "Hecho para defensores aprobados."
        text: >-
          Daybreak solo está abierto a personas y organizaciones que OpenAI aprueba para trabajo de seguridad autorizado, y las cuentas individuales deben iniciar sesión con llaves de seguridad físicas. LESIS pasó por esa verificación, cumple esos requisitos y hace el trabajo por ti, así que tu equipo recibe los resultados sin la postulación ni la carga operativa.
      closing:
        title: ["Los modelos de frontera", "ya están leyendo código.", "Asegúrate de que lean el tuyo primero."]
        text: "Cuéntanos qué operas. Te diremos por dónde debe empezar Daybreak y en cuánto tiempo puede correr."
    both:
      subject: "Acceso a modelos de frontera"
      eyebrow: "Modelos de frontera en ciberseguridad"
      title: "Mythos y Daybreak, trabajando para ti."
      lead:
        - "Anthropic y OpenAI han creado, cada una, modelos que encuentran vulnerabilidades escondidas durante décadas, y cada una los reserva para defensores verificados: Claude Mythos y OpenAI Daybreak."
        - "LESIS tiene acceso a ambos. Los corremos sobre tu código y tus sistemas, probamos cada resultado y ponemos lo que encuentran en un solo registro, listo para que tu equipo actúe."
      stats:
        - value: "Miles"
          text: "de zero-days de alta severidad encontrados por Claude Mythos en pocas semanas, en todos los grandes sistemas operativos y navegadores."
        - value: "27 años"
          text: "llevaba inadvertida la falla en OpenBSD que encontró Mythos."
        - value: "948"
          text: "posibles problemas en el kernel de Linux, con correcciones preparadas por los modelos de Daybreak, de OpenAI."
        - value: "81"
          text: "vulnerabilidades nuevas en Firefox encontradas por los mismos modelos."
      speech:
        eyebrow: "Por qué ahora"
        display: "La economía de encontrar vulnerabilidades acaba de romperse."
        text:
          - >-
            Un bug de 27 años en OpenBSD. Un bug de 16 años en FFmpeg por el que las pruebas habían pasado más de cinco millones de veces. Miles de zero-days de alta severidad en todos los grandes sistemas operativos y navegadores, de un modelo, en semanas. Correcciones para 948 posibles problemas en el kernel de Linux y 81 vulnerabilidades nuevas en Firefox, de otro.
          - >-
            Esos bugs no eran nuevos. Esperaban a algo lo bastante paciente para leer cada línea, y eso ahora existe en los dos lados de la pelea. Quien lo usa primero corrige lo que los atacantes habrían encontrado. Los demás se enteran por otro.
      compare:
        eyebrow: "Dos programas"
        title: "Dos laboratorios, dos lecturas independientes de tu código."
        intro: >-
          Los modelos de laboratorios distintos se entrenan de formas distintas y se les escapan cosas distintas. Correr ambos le da a una falla que uno pasa por alto una segunda oportunidad de ser detectada, y evita que dependas de un solo proveedor.
        access_label: "Acceso"
        strength_label: "Conocido por"
        lesis_label: "LESIS"
        items:
          - name: "Claude Mythos"
            by: "Anthropic"
            access: "Socios de Project Glasswing y el Cyber Verification Program."
            strength: "Encontrar y encadenar zero-days por sí solo; 83,1% en reproducción de vulnerabilidades de CyberGym."
            lesis: "Verificada por Anthropic en el Cyber Verification Program."
            path: "/mythos/"
            link: "Tu camino a Mythos &rarr;"
          - name: "Daybreak"
            by: "OpenAI"
            access: "Daybreak Blue y Daybreak Red, para defensores aprobados."
            strength: "Modelos de frontera ajustados para el trabajo de seguridad y modelos entrenados para investigación de vulnerabilidades y validación de exploits."
            lesis: "Verificada por OpenAI para Daybreak."
            path: "/daybreak/"
            link: "Tu camino a Daybreak &rarr;"
      access:
        title: "Cerrado al público. <br>Abierto para ti."
        text: >-
          Ninguno de los dos laboratorios vende estos modelos al público. El acceso pasa por verificación, reglas de uso y, en Daybreak, llaves de seguridad físicas. LESIS ya cumple con todo eso, así que recibes el trabajo de ambos sin postularte a ninguno.
      closing:
        title: ["Dos modelos de frontera.", "Un solo registro.", "Tu código, leído primero."]
        text: "Cuéntanos qué operas. Te diremos qué modelo debe empezar, por dónde y en cuánto tiempo."

