# --- Privacy policy and terms of use -------------------------------------------
legal_updated: "Última actualización: {date}."
legal_date: "18 de septiembre de 2026"

privacy:
  eyebrow: "Política de privacidad"
  title: "Tu información, tratada con cuidado."
  lead: "Esta política explica cómo LESIS trata la información personal cuando visitas lesis.lat o te comunicas con nuestro equipo por correo electrónico."
  sections:
    - title: "1. Quiénes somos"
      text:
        - >-
          LESIS (Laboratory of Engineering Studies in Information Security) opera este sitio y es responsable de la información personal descrita en esta política. Para preguntas sobre privacidad o solicitudes relacionadas con tu información personal, comunícate con nuestro delegado de protección de datos en <a href="mailto:dpo@lesis.lat">dpo@lesis.lat</a>. Para consultas generales, también puedes escribir a <a href="mailto:contact@lesis.lat">contact@lesis.lat</a>.
    - title: "2. Información que recopilamos"
      text:
        - >-
          Podemos recibir la información que decidas enviarnos por correo electrónico, como tu nombre, dirección de correo, organización y el contenido de tu mensaje cuando solicitas información o inicias una conversación. Nuestro sitio también puede procesar información técnica básica a través de los registros del hosting.
    - title: "3. Cómo usamos la información"
      text:
        - >-
          Usamos esta información para responder solicitudes, prestar y mejorar nuestros servicios, mantener la seguridad del sitio y cumplir obligaciones legales. No vendemos información personal ni la usamos para fines no relacionados.
    - title: "4. Compartir y conservar"
      text:
        - >-
          Podemos usar proveedores cuidadosamente seleccionados para hosting, correo electrónico y operación del sitio. Estos procesan la información solo en la medida necesaria para prestar esos servicios. Conservamos la información durante el tiempo necesario para el fin con el que se recopiló, para mantener registros comerciales o para cumplir requisitos legales.
    - title: "5. Transferencias internacionales"
      text:
        - >-
          La información personal puede procesarse o transferirse entre Brasil y Estados Unidos por parte de LESIS o de los proveedores que dan soporte a nuestro sitio y nuestras comunicaciones. Aplicamos las salvaguardas que exige la legislación de protección de datos aplicable y podemos brindar información adicional sobre una transferencia o un proveedor específico a través de <a href="mailto:dpo@lesis.lat">dpo@lesis.lat</a>.
    - title: "6. Tus opciones y derechos"
      text:
        - >-
          Según dónde vivas, puedes tener derecho a confirmar el tratamiento, acceder, corregir, eliminar o restringir el uso de tu información personal, y a oponerte a ciertos tratamientos. Para hacer una solicitud, escribe a nuestro delegado de protección de datos en <a href="mailto:dpo@lesis.lat">dpo@lesis.lat</a>. Es posible que necesitemos verificar tu identidad antes de responder.
    - title: "7. Analítica, cookies y enlaces externos"
      text:
        - >-
          Actualmente, el sitio carga la etiqueta de Google Analytics 4, de Google, después de que el visitante interactúa con la página o tras una breve demora. Puede recopilar páginas vistas, información del navegador y del dispositivo, ubicación aproximada y eventos de interacción, y puede usar la cookie propia <code>_ga</code>. Google describe cómo procesa esta información en su <a href="https://support.google.com/analytics/answer/11593727" rel="noopener noreferrer">documentación de Analytics</a>. No enviamos intencionalmente nombres, direcciones de correo electrónico ni contenidos de mensajes a Google Analytics. Los otros sitios enlazados desde este tienen sus propias políticas; LESIS no es responsable de su contenido ni de sus prácticas de privacidad.
        - >-
          Puedes eliminar o bloquear las cookies desde la configuración de tu navegador. Antes de usar esta implementación de analítica con visitantes que requieren consentimiento previo, LESIS debe ofrecer un mecanismo de consentimiento o desactivar la analítica hasta obtener el consentimiento.
    - title: "8. Cambios"
      text:
        - >-
          Podemos actualizar esta política cuando cambien nuestras prácticas o los requisitos legales. La fecha en la parte superior de esta página indica cuándo se revisó por última vez.

terms:
  eyebrow: "Términos de uso"
  title: "Uso del sitio de LESIS."
  lead: "Estos términos describen las condiciones de uso de lesis.lat y de su contenido público."
  sections:
    - title: "1. Aceptación"
      text:
        - "Al acceder a este sitio, aceptas estos términos. Si no estás de acuerdo, por favor no uses el sitio."
    - title: "2. Contenido del sitio"
      text:
        - >-
          LESIS ofrece este sitio como información general sobre sus investigaciones, servicios y publicaciones. El contenido es solo informativo y no constituye asesoramiento legal, financiero, de seguridad ni de ningún otro tipo profesional. El sitio puede cambiar sin previo aviso.
    - title: "3. Propiedad intelectual"
      text:
        - >-
          Salvo que se indique lo contrario, los textos, el diseño, los logos, las imágenes y los demás materiales de este sitio pertenecen a LESIS o a sus licenciantes. Puedes ver el sitio y compartir enlaces a él con fines lícitos e informativos. No reproduzcas, modifiques, distribuyas ni uses nuestros materiales con fines comerciales sin permiso por escrito.
    - title: "4. Uso aceptable"
      text:
        - >-
          No debes hacer un uso indebido del sitio, interferir en su funcionamiento, intentar accesos no autorizados, introducir código malicioso ni usar su contenido para violar ninguna ley ni los derechos de otras personas.
    - title: "5. Enlaces externos"
      text:
        - >-
          Este sitio puede incluir enlaces a sitios y servicios de terceros. Esos enlaces se ofrecen por conveniencia. LESIS no controla ni respalda el contenido de terceros y no es responsable de su disponibilidad, seguridad ni términos.
    - title: "6. Exenciones y responsabilidad"
      text:
        - >-
          El sitio se ofrece “tal como está disponible”. En la medida en que lo permita la ley, LESIS no garantiza que el sitio o su contenido estén completos, actualizados, sin interrupciones ni libres de errores. LESIS no es responsable de pérdidas derivadas de confiar en el contenido público del sitio o del uso de servicios enlazados.
    - title: "7. Contacto y cambios"
      text:
        - >-
          Las preguntas sobre estos términos pueden enviarse a <a href="mailto:contact@lesis.lat">contact@lesis.lat</a>. Podemos actualizar estos términos periódicamente; la fecha en la parte superior de esta página identifica la versión vigente.
