# --- Privacy policy and terms of use -------------------------------------------
# sections: one heading and its paragraphs each.
legal_updated: "Last updated: {date}."
legal_date: "September 18, 2026"

privacy:
  eyebrow: "Privacy policy"
  title: "Your information, handled with care."
  lead: "This policy explains how LESIS handles personal information when you visit lesis.lat or contact our team by email."
  sections:
    - title: "1. Who we are"
      text:
        - >-
          LESIS (Laboratory of Engineering Studies in Information Security) operates this website and is responsible for the personal information described in this policy. For privacy questions or requests concerning your personal information, contact our data protection officer at <a href="mailto:dpo@lesis.lat">dpo@lesis.lat</a>. For general inquiries, you can also contact <a href="mailto:contact@lesis.lat">contact@lesis.lat</a>.
    - title: "2. Information we collect"
      text:
        - >-
          We may receive information you choose to send us by email, such as your name, email address, organization and the contents of your message when you request information or start a conversation. Our website may also process basic technical information through hosting logs.
    - title: "3. How we use information"
      text:
        - >-
          We use this information to respond to requests, provide and improve our services, maintain website security and meet legal obligations. We do not sell personal information or use it for unrelated purposes.
    - title: "4. Sharing and retention"
      text:
        - >-
          We may use carefully selected providers for hosting, email and website operations. They process information only as needed to provide those services. We retain information for as long as necessary for the purpose collected, to maintain business records or to meet legal requirements.
    - title: "5. International transfers"
      text:
        - >-
          Personal information may be processed or transferred between Brazil and the United States by LESIS or by the providers that support our website and communications. We apply the safeguards required by applicable data protection law and can provide additional information about a specific transfer or provider through <a href="mailto:dpo@lesis.lat">dpo@lesis.lat</a>.
    - title: "6. Your choices and rights"
      text:
        - >-
          Depending on where you live, you may have rights to confirm processing, access, correct, delete or restrict the use of your personal information, and to object to certain processing. To make a request, email our data protection officer at <a href="mailto:dpo@lesis.lat">dpo@lesis.lat</a>. We may need to verify your identity before responding.
    - title: "7. Analytics, cookies and external links"
      text:
        - >-
          The website currently loads the Google Analytics 4 tag from Google after a visitor interacts with the page or after a short delay. It may collect page views, browser and device information, approximate location and interaction events, and may use the first-party <code>_ga</code> cookie. Google describes how it processes this information in its <a href="https://support.google.com/analytics/answer/11593727" rel="noopener noreferrer">Analytics documentation</a>. We do not intentionally send names, email addresses or message contents to Google Analytics. Other websites linked from this site have their own policies; LESIS is not responsible for their content or privacy practices.
        - >-
          You can delete or block cookies through your browser settings. Before this analytics implementation is used for visitors who require prior consent, LESIS should provide a consent mechanism or disable analytics until consent is obtained.
    - title: "8. Changes"
      text:
        - >-
          We may update this policy when our practices or legal requirements change. The date at the top of this page shows when it was last revised.

terms:
  eyebrow: "Terms of use"
  title: "Using the LESIS website."
  lead: "These terms describe the conditions for using lesis.lat and its public content."
  sections:
    - title: "1. Acceptance"
      text:
        - "By accessing this website, you agree to these terms. If you do not agree, please do not use the site."
    - title: "2. Website content"
      text:
        - >-
          LESIS provides this website for general information about its research, services and publications. Content is provided for information only and does not constitute legal, financial, security or other professional advice. The website may change without notice.
    - title: "3. Intellectual property"
      text:
        - >-
          Unless stated otherwise, the text, design, logos, images and other materials on this website belong to LESIS or its licensors. You may view and share links to the site for lawful, informational purposes. Do not reproduce, modify, distribute or use our materials commercially without written permission.
    - title: "4. Acceptable use"
      text:
        - >-
          You must not misuse the website, interfere with its operation, attempt unauthorized access, introduce malicious code or use its content to violate any law or another person's rights.
    - title: "5. External links"
      text:
        - >-
          This website may link to third-party websites and services. Those links are provided for convenience. LESIS does not control or endorse third-party content and is not responsible for their availability, security or terms.
    - title: "6. Disclaimers and liability"
      text:
        - >-
          The website is provided on an “as available” basis. To the extent permitted by law, LESIS makes no warranty that the website or its content will be complete, current, uninterrupted or error-free. LESIS is not liable for losses arising from reliance on public website content or use of linked services.
    - title: "7. Contact and changes"
      text:
        - >-
          Questions about these terms can be sent to <a href="mailto:contact@lesis.lat">contact@lesis.lat</a>. We may update these terms from time to time; the date at the top of this page identifies the current version.
