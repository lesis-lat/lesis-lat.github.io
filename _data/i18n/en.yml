# --- Home page ----------------------------------------------------------------
home:
  hero:
    eyebrow: "The LESIS Platform"
    title: "One AI-native cybersecurity platform <span class='hero-title-sub'>for your entire program.</span>"
    lead: >-
      Vulnerabilities, code, attack surface, knowledge and incidents.<br>AI verifies every finding before it reaches your team, and LESIS engineers stand behind every decision.
    see_platform: "See the platform"
    screen: "Security posture"
    alt: "The LESIS security posture page: findings past their deadline, time to fix and the attention points that need a decision."
    video_alt: "A walkthrough of LESIS: from the security posture page to the vulnerabilities list, a critical finding with its attack tree and evidence, the remediation analytics, and back to the posture page."
    caption: "Screens from the product, shown with a fictional organization"

  clients:
    label: "Organizations LESIS has helped protect"
    title: "Organizations we've helped protect"
    empty: "Fintechs, retail, healthcare, telecommunications and lawtechs"

  what:
    eyebrow: "Why LESIS"
    display: "Security teams don't need more alerts. They need findings someone stands behind."
    text:
      - >-
        Most security programs run on a patchwork: a scanner here, a spreadsheet of findings there, a consultancy's PDF, a runbook in someone's drive. Nobody can say, at any given moment, what is open, who owns it and whether it is getting better.
      - >-
        LESIS replaces the patchwork with one record. Every finding carries evidence, an owner and a deadline. AI reads your code and reports only what it can prove. LESIS engineers decide what needs a person. Leadership sees posture, not noise.

  media:
    pause: "Pause animation"
    play: "Play animation"

  platform:
    eyebrow: "The platform"
    title: "Everything your security program runs on."
    intro: >-
      Every capability runs on the same data, so a finding in code, a threat model and an incident all point to the same systems and the same people.
    features:
      - label: "Posture and analytics"
        title: "Know where you stand at any moment."
        text: "Twelve months of findings opened, fixed and closed, time to fix by severity, and the attention points that need a decision now, each with why it matters and what to do next."
        points: ["Security posture and remediation health", "Attention points with a next step", "What your program found is worth", "Benchmark against comparable organizations"]
        image: "analytics"
        height: 1100
        screen: "Analytics"
        alt: "The LESIS analytics page: moving across twelve months of findings opened, resolved and closed shows each month's numbers, then the average time to fix by severity."
      - label: "Vulnerability management"
        title: "Every finding, from first evidence to proof of fix."
        text: "An eight-state lifecycle, a deadline set by severity, evidence and comments on the finding itself, and attack trees drawn from the analysis. Remediators move findings forward; closing one takes an analyst."
        points: ["Deadlines per severity, set by your organization", "Attack trees on the finding", "Share one finding with an outside guest", "Automatic retests for code findings"]
        image: "finding"
        height: 1280
        screen: "Vulnerabilities"
        alt: "A critical finding in LESIS: it moves from Identified to Fixing, then the evidence, impact, recommendation, state history and the comment thread between the LESIS analyst, the security lead and the engineer."
      - label: "Code security"
        title: "Code review that has to prove it."
        text: "Connect GitHub, GitLab or Bitbucket with read-only access. AI maps each application, follows the data to where it is used and reports only what a second, stronger review confirms. Secrets are judged without the value ever being read."
        points: ["Read-only connections, kept in sync", "AI code review, verified before it reports", "Secret scanning that never sees the value", "Only what changed is read again"]
        image: "repositories"
        height: 900
        screen: "Code repositories"
        alt: "LESIS code repositories: opening payments-api shows its secret scan and the AI code review, where five possible vulnerabilities were checked by a second review and one was confirmed, then the findings linked to it."
      - label: "Exploit chains and root causes"
        title: "See how findings chain into real attacks."
        text: "AI correlates open findings into attack paths and groups them by the correction they share. Analysts edit, add or dismiss each step, and every change is marked with who made it."
        points: ["Attack paths across findings and assets", "Root causes that close several findings at once", "Steps edited or added by people, marked as such", "Present mode and YAML export"]
        image: "exploit-chains"
        height: 950
        screen: "Exploit chains"
        alt: "LESIS exploit chains: selecting an attack path from merchant admin takeover to card data highlights it in the graph, a step shows how it is reached and where it leads, and the path opens with its seven steps and evidence."
      - label: "Attack surface"
        title: "Every asset, repository and how they connect."
        text: "An inventory of what you own and where the code lives, drawn as a graph with the open findings on each resource. Internet-facing systems are marked, and links you record are kept apart from links the analysis derives."
        points: ["Assets and repositories, linked", "Open findings on each resource", "Internet-facing systems marked", "Recorded and derived relationships kept apart"]
        image: "resource-graph"
        height: 1000
        screen: "Resource graph"
        alt: "The LESIS resource graph in use: selecting the payments gateway shows its environment, criticality and connections; with vulnerabilities shown as nodes, one linked to the gateway opens as a finding with its evidence."
      - label: "Knowledge"
        title: "Your policies and threat models, linked to the work."
        text: "Policies, procedures, playbooks, runbooks and threat models live next to the findings they explain. Mention a finding, asset, repository or investigation and it is linked to the document. Attack trees are drawn in the page and can be presented or exported."
        points: ["Policies, procedures, playbooks, runbooks and threat models", "Mentions that link findings, assets and repositories", "Attack trees drawn in the document", "Search every document in plain words"]
        image: "knowledge"
        height: 1300
        screen: "Knowledge"
        alt: "A threat model in LESIS Knowledge: hovering the assets and findings it mentions shows a preview of each, with severity, status and a short description."
      - label: "Your advisor"
        title: "A named engineer, one click away."
        text: "Your organization gets a LESIS advisor inside the platform: a security engineer who knows your systems, reviews what the AI proposes and joins your team when a fix needs a second pair of eyes. Email them or book a call without leaving LESIS."
        points: ["A named LESIS engineer for your organization", "Profile, e-mail and booking link in the app", "Reviews AI proposals and fixes with your team", "Next to the assistant, on the home screen"]
        image: "advisor"
        height: 900
        screen: "Home"
        alt: "The LESIS home screen: selecting the organization's advisor opens her profile beside it, with a bio, e-mail and booking options."

  ai:
    eyebrow: "AI with guardrails"
    title: "AI that has to prove it <br>before it tells you."
    intro: >-
      Every AI feature in LESIS works under the same rules. They are why a short list of findings can be trusted, and why the AI never becomes the place where a decision is made.
    items:
      - title: "Proof before a finding"
        text: "A suspicion becomes a finding only when every review confirms how an attacker reaches it. High and critical ones are checked twice."
      - title: "It never sees a secret"
        text: "Candidate credentials are judged from the code around them. The value is masked on screen and removed before code reaches a model."
      - title: "AI spend in the open"
        text: "Tokens and estimated cost for every AI feature, per organization and model, so usage is never a surprise."
      - title: "AI proposes, people decide"
        text: "Exploit chains, root causes and suggested records stay drafts until an analyst confirms, edits or dismisses them, and every change shows who made it."
      - title: "Proof of fix, too"
        text: "When a code finding moves to Retest, AI checks it against the current code and posts the result on the finding."

  api:
    eyebrow: "API"
    title: "Your program, programmable."
    intro: >-
      A documented REST API covers the platform, so findings flow into your tickets, your SIEM and your data warehouse, and your own AI agents work with the same records your team sees, under the same permissions.
    points: ["A documented REST API for every module", "Keys bound to one organization and their owner's permissions", "Read and write scopes, expiry and revocation", "A guide for AI agents, downloadable as Markdown"]
    soon_label: "Coming soon"
    soon_tag: "Soon"
    soon:
      - title: "LESIS CLI"
        text: "Query and update your program from the terminal and from your CI pipelines."
      - title: "LESIS MCP server"
        text: "Give your AI assistants and coding agents governed access to your findings, within the permissions of the key."
    code_title: "List critical and high findings past their SLA"
    code_label: "Example API request listing critical and high findings past their SLA, and its JSON response."

  enterprise:
    eyebrow: "Enterprise"
    title: "Built for organizations <br>with more than one of everything."
    intro: >-
      Subsidiaries, business units, outside researchers and auditors, each with exactly the access they need, and a record of everything they did.
    items:
      - title: "Multi-organization"
        text: "Run each business unit or subsidiary as its own organization, with its own deadlines, and see them all together when you need to."
      - title: "Roles that match how you work"
        text: "Eight roles, from administrator to analyst, remediator and guest. The server enforces every one of them."
      - title: "A complete audit trail"
        text: "Every write in every module, recorded with the account that made it and when."
      - title: "Guest access"
        text: "Share a single finding or investigation with an outside guest, read-only, without opening the rest of the program."
      - title: "Benchmark"
        text: "Remediation metrics set beside comparable organizations on the platform, without naming any of them."
      - title: "The value of the program"
        text: "What your program has found is worth, calculated from the value your organization puts on each severity."
      - title: "Two-step sign-in"
        text: "A password and a one-time code, with new accounts approved by an administrator before they can sign in."
      - title: "Least privilege on your code"
        text: "Read-only repository access, scan tokens limited to one repository, and credentials stored encrypted."
      - title: "Deadlines you set"
        text: "Remediation windows per severity for each organization, with every overdue finding flagged before anyone asks."

  people:
    eyebrow: "Experts on call"
    display: "Engineers behind every finding."
    text: >-
      LESIS is built and backed by a security research lab. Your organization has a named LESIS advisor, and the same engineers review what the AI proposes, triage what outside researchers send and run deeper assessments when a system needs one.
    items:
      - title: "Your advisor"
        text: "A named LESIS engineer for your organization, reachable from inside the platform, who knows your context."
      - title: "Decisions AI cannot make"
        text: "Analysts confirm or dismiss what the AI proposes, and test what code review cannot reach."
      - title: "Disclosure triage"
        text: "Every report from an outside researcher is triaged by LESIS before it reaches your team."
      - title: "Assessments"
        text: "Vulnerability research, architecture review and incident investigations, with every finding landing in the same record."

  ways:
    title: "Ways to run LESIS"
    intro: >-
      Run the platform with your own team, or have LESIS run your program on it with you. Either way the record is yours, and the engineers behind it are the same.
    platform:
      title: "Platform"
      lead:
        - "Your team runs the program on LESIS."
        - >-
          Every capability for your organization: posture and analytics, vulnerability management, code security, exploit chains and root causes, your attack surface and knowledge. AI does the reading, and your LESIS advisor is there when a decision needs a second opinion.
    managed:
      title: "Managed"
      lead:
        - "LESIS runs your security program on the platform, alongside your team."
        - >-
          Findings triaged, chased, retested and closed. Disclosure reports triaged as they arrive. Inventory, runbooks and policies kept current; awareness campaigns and training run to completion; the trust center kept ready; posture reported against comparable organizations. What you contribute is not headcount but access: your engineers act when acting matters, and what they learn goes into the record as they work.
    partners: >-
      Consultancies can deliver LESIS under their own brand, or refer clients to us, through the <a href="{partnership_url}">LESIS Partnership Program</a>, without building an internal team.

  record:
    eyebrow: "Track record"
    title: "Engineers you can verify"
    intro: >-
      The judgment in LESIS comes from people with a public record: vulnerability disclosures, experience inside major technology companies, and contributions to the security community through competitions and conference talks.
    items:
      - title: "Published vulnerability research"
        text: >-
          Members of our team have reported vulnerabilities to D-Link, documented in <a href="https://nvd.nist.gov/vuln/detail/CVE-2020-9376" target="_blank" rel="noopener noreferrer">CVE-2020-9376</a> and <a href="https://nvd.nist.gov/vuln/detail/CVE-2020-9377" target="_blank" rel="noopener noreferrer">CVE-2020-9377</a>, and to MISP, recorded as <a href="https://nvd.nist.gov/vuln/detail/CVE-2020-28043" target="_blank" rel="noopener noreferrer">CVE-2020-28043</a>. Their work also includes reports to Oracle and Apple, with public records in <a href="https://www.oracle.com/security-alerts/cpujul2022.html" target="_blank" rel="noopener noreferrer">Oracle's July 2022 Critical Patch Update</a> and <a href="https://support.apple.com/en-gb/102774" target="_blank" rel="noopener noreferrer">Apple's web server security acknowledgements</a>.
      - title: "Participation in CTF competitions"
        text: >-
          Members of our team have competed in Capture The Flag events, taking first place in the CTF at BSides São Paulo and winning a Hackaflag qualifier. LESIS also supports teams in the community: at <a href="https://www.sbseg2026.uff.br/" target="_blank" rel="noopener noreferrer">SBSeg 2026</a>, the GRIS/UFRJ team, supported by LESIS, <a href="{bulletin_url}">placed first among 18 teams</a> in challenges covering traffic analysis, forensics and incident investigation.
      - title: "Experience at market leaders"
        text: >-
          Our team includes engineers who have worked at companies such as Nubank, Latin America's largest digital bank, and Globo, Brazil's largest media company, as well as at Brazil's leading cybersecurity vendors and other companies just as strong, if less well known. They bring experience with the engineering demands of systems serving millions of people to their work at LESIS.
      - title: "Speaking at security events"
        text: >-
          Members of our team have presented talks at events such as BxSec, Roadsec, BSides Rio de Janeiro and XibéSec. These contributions bring our team's experience into discussions with other security professionals and help share knowledge across the Brazilian security community.

  work:
    transition: "Explore our published research and open-source tools."
    tool: "Open-source tool"
    no_release: "No published release"
    tools:
      security_gate: "Apply configurable security thresholds to GitHub alerts so your team can enforce checks in its CI/CD pipeline."
      bunkai: "Examine dependencies in Perl projects for outdated modules and known vulnerabilities, with results that fit development workflows."
      kasumi: "Extract and search Slack messages by keyword and date range to support authorized security assessments."
    all_publications: "All publications &rarr;"
    explore_tools: "Explore our tools &rarr;"

  closing:
    title: ["One platform", "for the whole program.", "See it on yours."]
    text: >-
      In a demo we walk through the platform with a fictional organization, then talk about yours: what you run, who looks after it and where your findings live today.

