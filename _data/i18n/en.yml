# --- Home page ----------------------------------------------------------------
home:
  hero:
    title: "Cybersecurity, tailored <br>to your mission."
    lead: >-
      LESIS is a partner, not a product. We are a security engineering team that works closely with each client and shapes the scope, the method and the tools around the system in question. No two engagements are alike.
    see_how: "See how an engagement runs"
    cards:
      - label: "Finding &middot; VUL-0417"
        title: "Account takeover via stored XSS"
        meta: ["Critical severity, fixing", "Deadline in 2 days", "Linked to portal.example.com"]
        badge: "Critical"
      - label: "Investigation &middot; INV-0042"
        title: "Unexplained admin actions in the audit log"
        meta: ["High severity, under investigation", "Entry point reproduced, evidence attached", "Linked to 2 findings and the admin console"]
        badge: "High"
        note: "Timeline open"
      - label: "Research &middot; TOOL-0031"
        title: "Custom fuzzer for the partner API"
        meta: ["4.2M cases over 19 hours", "3 crashes triaged, 1 reproducible", "Raised as VUL-0429, critical"]
        badge: "Fuzzing"

  clients:
    label: "Organizations LESIS has reported vulnerabilities to"
    title: "Who we have helped protect"
    empty: "Fintechs, retail, healthcare, telecommunications and lawtechs"

  what:
    eyebrow: "Your security R&amp;D partner"
    display: "The future of the internet is still unwritten. We are here to make sure the next chapter is written securely."
    text:
      - >-
        Our approach is grounded in a thorough attacker's perspective and in research-driven thinking. We understand what each organization needs and adapt to requirements that differ from one to the next, so that the investment in security becomes a differentiator for the business, and the investments already made are preserved. LESIS works with fintechs, retail, healthcare, telecommunications and lawtechs.
      - >-
        As an independent institution, with no ties to other companies or investors, we are neutral when we evaluate products and technology, and our work is judged on its quality alone. Our consultants bring more than ten years of experience and have reported vulnerabilities to D-Link (CVE-2020-9376 and CVE-2020-9377), Apple, Activision, Oracle and MISP (CVE-2020-28043).

  execution:
    eyebrow: "How we execute"
    display: "Security is not linear. Neither is our execution."
    text: >-
      In the traditional model, a single analyst conducts the whole assessment. LESIS runs each project as a collaborative effort, with several specialists working on the same system at the same time, each bringing a different background to it.
    items:
      - title: "Greater technical coverage"
        text: "More components examined, and more than one way of examining each of them."
      - title: "Fewer individual biases"
        text: "No single assumption about the system goes unchallenged."
      - title: "Cross-validation of findings"
        text: "Each vulnerability is confirmed by more than one engineer before it is recorded."
      - title: "Deeper scenarios"
        text: "Time to follow a chain of weaknesses to what it actually exposes."

  engineering:
    eyebrow: "What we do"
    title: "We follow security problems from design to code to execution."
    intro: >-
      Application security, architecture review and software supply chain security, supported by static analysis, fuzzing, reverse engineering and exploit development. We bring these disciplines together to investigate your system.
    items:
      - title: "Review the system's design"
        text: "Map trust boundaries, review architecture and assess security controls to understand how design decisions affect the system's exposure to attacks."
      - title: "Investigate how it can fail"
        text: "Combine pentesting, code review, static analysis and reverse engineering to find weaknesses, then develop exploits to verify how they can be used and establish their impact."
      - title: "Build tools to look deeper"
        text: "Build fuzzing harnesses, custom analyzers and instrumentation to reach complex code paths, examine runtime behavior and investigate weaknesses that need a closer look."

  # The six steps of "How an engagement runs". Each one has its text and the
  # labels of its illustration (d); the illustration's boxes have fixed widths,
  # so translated labels must stay about as short as these.
  journey:
    eyebrow: "How an engagement runs"
    title: "Understand the system. Leave your team stronger."
    intro: >-
      We work with your engineers to turn a security question into a result they can use: a design, a technical decision, a research finding or a working tool. The methods and deliverables follow the problem. Throughout the engagement, we build the understanding your team needs to carry the work forward.
    steps:
      - label: "Context"
        title: "Understand the context"
        text: >-
          Study the systems, workflows and requirements the work depends on. We examine existing research and available approaches, identify assumptions and establish which questions need further investigation.
        toolbar: "Context &middot; system map"
        count: "12 components"
        subhead: "Where the work rests on assumptions"
        links: ["4 trust boundaries", "1 assumption to test", "2 prior reports"]
        d:
          network: "INTERNAL NETWORK"
          partners: "PARTNERS"
          gateway: "GATEWAY"
          payments: "PAYMENTS API"
          ci: "CI PIPELINE"
          ledger: "LEDGER"
          database: "DATABASE"
          trusts: ["TRUSTS THE", "CALLER HEADER"]
      - label: "Scope"
        title: "Define the outcome together"
        text: >-
          Start with what your team needs to understand, decide or build. We agree on the objectives, constraints and deliverables, whether the work concerns an architecture, a security control, a technical investigation or a new tool.
        toolbar: "Scope &middot; engagement brief"
        count: "v1 agreed"
        subhead: "Many questions, one agreed outcome"
        links: ["agreed before work starts", "owners named"]
        d:
          needs: "YOUR TEAM NEEDS TO"
          understand: "UNDERSTAND"
          decide: "DECIDE"
          build: "BUILD"
          outcome: "AGREED OUTCOME"
          objectives: "OBJECTIVES"
          constraints: "CONSTRAINTS"
          deliverables: "DELIVERABLES"
          brief: "THE BRIEF, WRITTEN TOGETHER"
      - label: "Approach"
        title: "Choose an approach we can evaluate"
        text: >-
          Work through the technical options and tradeoffs with your engineers. Define the methods, interfaces and success criteria so we can assess the result against the problem it needs to solve.
        toolbar: "Approach &middot; service authentication"
        count: "3 options"
        subhead: "Options weighed against agreed criteria"
        links: ["tradeoffs recorded", "criteria set together"]
        d:
          question: "THE QUESTION"
          mtls: "MTLS"
          tokens: "SIGNED TOKENS"
          network: "NETWORK RULES"
          criteria: "ACCEPTANCE CRITERIA"
          later: "LATER"
          "no": "NO"
          chosen: "CHOSEN APPROACH"
      - label: "Development"
        title: "Develop the solution through evidence"
        text: >-
          Research, experiment and build in iterations, adjusting the approach as the evidence develops. When the scope includes custom harnesses, analyzers or instrumentation, we build them for your engineers to keep using, with instructions for running them and interpreting the results.
        toolbar: "Development &middot; iteration log"
        count: "week 3 of 5"
        subhead: "Build, observe, adjust"
        links: ["2 tools built", "1 finding", "kept by your team"]
        d:
          iteration: "ITERATION 3"
          evidence: "EVIDENCE-LED"
          build: "BUILD"
          observe: "OBSERVE"
          adjust: "ADJUST"
          kept: "KEPT BY YOUR TEAM"
          harness: "HARNESS"
          fuzzer: "FUZZER"
          runbook: "RUNBOOK"
          rounds: "EACH ROUND CHANGES THE NEXT"
      - label: "Validation"
        title: "Test it against real requirements"
        text: >-
          Evaluate the result against the agreed criteria and real operating conditions. Document its behavior, limitations and tradeoffs, and resolve gaps with your engineers. Where applicable, deliver reproducible test cases and regression checks so your team can verify fixes and detect recurring weaknesses.
        toolbar: "Validation &middot; signed service tokens"
        count: "14 checks"
        subhead: "Every criterion, under real conditions"
        links: ["reproducible", "regression checks in CI", "limits documented"]
        d:
          unit: "UNIT"
          stage: "STAGE"
          replay: "REPLAY"
          ci: "CI"
          result: "RESULT"
          forged: "FORGED HEADER"
          audience: "WRONG AUDIENCE"
          rotation: "KEY ROTATION"
          revocation: "REVOCATION"
          retest: "FIX RETEST"
          pass: "PASS"
          limit: "LIMIT"
          fixed: "FIXED"
          passes: "PASSES"
          documented: "DOCUMENTED LIMIT"
          na: "NOT APPLICABLE"
      - label: "Handover"
        title: "Equip your team to carry it forward"
        text: >-
          Deliver the agreed artifacts and explain the reasoning through technical walkthroughs. Depending on the scope, these include threat models, root-cause analysis and documented design decisions your engineers can apply as the system evolves. Suitable results can also become public research or open-source contributions, when agreed.
        toolbar: "Handover &middot; ownership"
        count: "6 artifacts"
        subhead: "Who can carry the work, week by week"
        links: ["owned by your engineers", "runs without us"]
        d:
          week: "WK"
          after: "AFTER"
          artifacts: ["SCOPE", "MAP", "ADR", "TOOLS", "TESTS", "GUIDE"]
          your_team: "YOUR TEAM"
          lesis: "LESIS"

  ways:
    title: "Ways of working with LESIS"
    intro: >-
      Work with us on a defined technical problem or through an ongoing engineering collaboration. Both bring research, practical guidance and follow-up on the findings.
    projects:
      title: "Projects"
      lead: "A scoped engagement with a defined system, technical objective, method and timeline."
      services:
        - title: "Security Engineering"
          summary: "Work alongside our engineers on architecture, security controls and the secure development lifecycle of a product as it evolves."
          body:
            - >-
              We review designs, map trust boundaries and data flows, and help your team assess security decisions before and during implementation. The collaboration can cover a new system, a migration or changes to an existing product, with focused investigation and validation where needed.
            - >-
              We also build application security into your development cycle (SSDLC). We select, implement and tune SAST, DAST and SCA for your stack and CI/CD pipeline, define the thresholds at which a build fails, and triage what the tools report, so engineers receive findings that are real and actionable rather than a queue of alerts. Where it fits, we use tooling we maintain, such as <a href="https://github.com/lesis-lat/security-gate" target="_blank" rel="noopener noreferrer">Security Gate</a>.
        - title: "Vulnerability Research"
          summary: "Investigate how your system can be compromised, with reproducible evidence and guidance for remediation."
          body:
            - >-
              We scope the assessment around the product's threat model and attack surface. Depending on the system, the work combines application and infrastructure testing, architecture and code review, and reverse engineering. We investigate attack chains, explain their impact and retest the fixes.
        - title: "Custom Security Tooling"
          summary: "Build the fuzzers, analyzers and instrumentation needed to investigate your system."
          body:
            - >-
              We develop tools around specific formats, interfaces and behaviors, from test harnesses to custom analysis. The scope defines what the tool must examine and how your team will use it, whether for a focused investigation or repeated testing.
            - >-
              Some of that work runs on language models where they do better than a fixed rule: reviewing code changes for security-relevant behavior before they merge, triaging analyzer output against the code it points to, or testing your own model-based features for prompt injection and data exposure. Each one is measured against the cases it must catch before your team relies on it.
        - title: "Incident Investigations"
          summary: "We do not run the response; we join the team that does, for one part of it: establishing how the intrusion began, and proving it rather than asserting it."
          body:
            - >-
              Most of what an incident demands belongs to the team already handling it: containment, eradication, communication. We do not take that over. We join for the way in. We take the evidence back to the specific weakness that made the intrusion possible and then demonstrate that weakness, reproducing the path instead of naming a probable cause, so the conclusion still holds when someone questions it. What comes out is not a narrative but a finding: an entry point with evidence, a severity, a deadline and a retest, linked on the platform to the affected systems and to the timeline of the investigation it came from. This is worth commissioning for a narrow set of incidents. When the way in is already understood, or when nothing technical was exploited at all, there is nothing for us to prove, and we say so before the work starts rather than after.
        - title: "Due Diligence"
          summary: "We assess what a transaction brings with it, a company, a codebase or a product you are about to adopt, on the timeline the transaction allows."
          body:
            - >-
              A decision to acquire, invest in or adopt something is made against a deadline, and usually with less access than an ordinary engagement. We work within both. Before a deal closes we establish the security posture of what is being bought to the depth the available access permits, and separate what is merely untidy from what becomes expensive later. Once it closes, the same engineers examine the acquired systems with the access ownership now allows, and state what has to be resolved before the environments are joined. The same work applies when you are evaluating a product rather than a company: we assess it on your behalf, with no relationship to its vendor. In each case the result is a record on the platform, where every finding carries evidence, severity and a deadline and stays open until it is fixed, so the assessment keeps working for whoever owns the system afterwards.
    program:
      title: "Ongoing collaboration"
      lead:
        - "Work with a security engineering team that builds knowledge of your systems over time."
        - >-
          Together we define priorities and a cadence for design reviews, focused assessments and technical investigation. As your product changes, we revisit its assumptions and help your engineers address new risks. The platform is where that work accumulates: context from every review, assessment and investigation carries into the next, so your security operation stops rebuilding what is already known and each cycle goes deeper into the problem.
    partners: >-
      Consultancies can deliver our assessments and research under their own brand, or refer clients to us, through the <a href="{partnership_url}">LESIS Partnership Program</a>, without building an internal team.

  record:
    eyebrow: "Research, experience &amp; community"
    title: "Work you can verify"
    intro: >-
      Public vulnerability disclosures, experience inside major technology companies and contributions to the security community through competitions and conference talks.
    items:
      - title: "Published vulnerability research"
        text: >-
          Members of our team have reported vulnerabilities to D-Link, documented in <a href="https://nvd.nist.gov/vuln/detail/CVE-2020-9376" target="_blank" rel="noopener noreferrer">CVE-2020-9376</a> and <a href="https://nvd.nist.gov/vuln/detail/CVE-2020-9377" target="_blank" rel="noopener noreferrer">CVE-2020-9377</a>, and to MISP, recorded as <a href="https://nvd.nist.gov/vuln/detail/CVE-2020-28043" target="_blank" rel="noopener noreferrer">CVE-2020-28043</a>. Their work also includes reports to Oracle and Apple, with public records in <a href="https://www.oracle.com/security-alerts/cpujul2022.html" target="_blank" rel="noopener noreferrer">Oracle's July 2022 Critical Patch Update</a> and <a href="https://support.apple.com/en-gb/102774" target="_blank" rel="noopener noreferrer">Apple's web server security acknowledgements</a>.
      - title: "Participation in CTF competitions"
        text: >-
          Members of our team have competed in Capture The Flag events, taking first place in the CTF at BSides São Paulo and winning a Hackaflag qualifier. LESIS also supports teams in the community: at <a href="https://www.sbseg2026.uff.br/" target="_blank" rel="noopener noreferrer">SBSeg 2026</a>, the GRIS/UFRJ team, supported by LESIS, <a href="{bulletin_url}">placed first among 18 teams</a> in challenges covering traffic analysis, forensics and incident investigation.
      - title: "Experience at market leaders"
        text: >-
          Our team includes engineers who have worked at companies such as Nubank, Latin America's largest digital bank, and Globo, Brazil's largest media company, as well as at Brazil's leading cybersecurity vendors and other companies just as strong, if less well known. They bring experience with the engineering demands of systems serving millions of people to their work at LESIS.
      - title: "Speaking at security events"
        text: >-
          Members of our team have presented talks at events such as BxSec, Roadsec, BSides Rio de Janeiro and XibéSec. These contributions bring our team's experience into discussions with other security professionals and help share knowledge across the Brazilian security community.

  work:
    transition: "Explore our published research and open-source tools."
    tool: "Open-source tool"
    no_release: "No published release"
    tools:
      security_gate: "Apply configurable security thresholds to GitHub alerts so your team can enforce checks in its CI/CD pipeline."
      bunkai: "Examine dependencies in Perl projects for outdated modules and known vulnerabilities, with results that fit development workflows."
      kasumi: "Extract and search Slack messages by keyword and date range to support authorized security assessments."
    all_publications: "All publications &rarr;"
    explore_tools: "Explore our tools &rarr;"

  closing:
    title: ["Every engagement begins", "with the question", "you actually have."]
    text: >-
      Tell us what you need to find out: about a system you run, a company you are about to buy, a design nobody has built yet, or something that already happened. We come back with the scope, the method and the timeline.

