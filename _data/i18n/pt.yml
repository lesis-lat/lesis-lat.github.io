privacy:
  eyebrow: "Política de privacidade"
  title: "Suas informações, tratadas com cuidado."
  lead: "Esta política explica como a LESIS trata informações pessoais quando você visita lesis.lat ou entra em contato com nossa equipe por e-mail."
  sections:
    - title: "1. Quem somos"
      text:
        - >-
          A LESIS (Laboratory of Engineering Studies in Information Security) opera este site e é responsável pelas informações pessoais descritas nesta política. Para dúvidas sobre privacidade ou solicitações relativas às suas informações pessoais, entre em contato com nosso encarregado pela proteção de dados em <a href="mailto:dpo@lesis.lat">dpo@lesis.lat</a>. Para assuntos gerais, você também pode escrever para <a href="mailto:contact@lesis.lat">contact@lesis.lat</a>.
    - title: "2. Informações que coletamos"
      text:
        - >-
          Podemos receber informações que você decide nos enviar por e-mail, como seu nome, endereço de e-mail, organização e o conteúdo da sua mensagem quando você solicita informações ou inicia uma conversa. Nosso site também pode processar informações técnicas básicas por meio dos logs de hospedagem.
    - title: "3. Como usamos as informações"
      text:
        - >-
          Usamos essas informações para responder a solicitações, prestar e melhorar nossos serviços, manter a segurança do site e cumprir obrigações legais. Não vendemos informações pessoais nem as usamos para finalidades não relacionadas.
    - title: "4. Compartilhamento e retenção"
      text:
        - >-
          Podemos usar fornecedores cuidadosamente selecionados para hospedagem, e-mail e operação do site. Eles processam as informações apenas na medida necessária para prestar esses serviços. Mantemos as informações pelo tempo necessário para a finalidade para a qual foram coletadas, para manter registros de negócio ou para cumprir exigências legais.
    - title: "5. Transferências internacionais"
      text:
        - >-
          Informações pessoais podem ser processadas ou transferidas entre o Brasil e os Estados Unidos pela LESIS ou pelos fornecedores que dão suporte ao nosso site e às nossas comunicações. Aplicamos as salvaguardas exigidas pela legislação de proteção de dados aplicável e podemos fornecer informações adicionais sobre uma transferência ou um fornecedor específico por meio de <a href="mailto:dpo@lesis.lat">dpo@lesis.lat</a>.
    - title: "6. Suas escolhas e direitos"
      text:
        - >-
          Dependendo de onde você mora, você pode ter direito a confirmar a existência de tratamento, acessar, corrigir, excluir ou restringir o uso das suas informações pessoais, e a se opor a determinados tratamentos. Para fazer uma solicitação, escreva para nosso encarregado pela proteção de dados em <a href="mailto:dpo@lesis.lat">dpo@lesis.lat</a>. Podemos precisar verificar sua identidade antes de responder.
    - title: "7. Analytics, cookies e links externos"
      text:
        - >-
          Atualmente, o site carrega a tag do Google Analytics 4, do Google, depois que o visitante interage com a página ou após um breve intervalo. Ela pode coletar visualizações de página, informações do navegador e do dispositivo, localização aproximada e eventos de interação, e pode usar o cookie próprio <code>_ga</code>. O Google descreve como processa essas informações na sua <a href="https://support.google.com/analytics/answer/11593727" rel="noopener noreferrer">documentação do Analytics</a>. Não enviamos intencionalmente nomes, endereços de e-mail ou conteúdos de mensagens ao Google Analytics. Outros sites com links a partir deste têm suas próprias políticas; a LESIS não é responsável pelo conteúdo nem pelas práticas de privacidade deles.
        - >-
          Você pode excluir ou bloquear cookies nas configurações do seu navegador. Antes que esta implementação de analytics seja usada com visitantes que exigem consentimento prévio, a LESIS deve oferecer um mecanismo de consentimento ou desativar o analytics até que o consentimento seja obtido.
    - title: "8. Alterações"
      text:
        - >-
          Podemos atualizar esta política quando nossas práticas ou exigências legais mudarem. A data no topo desta página indica quando ela foi revisada pela última vez.

terms:
  eyebrow: "Termos de uso"
  title: "Usando o site da LESIS."
  lead: "Estes termos descrevem as condições de uso de lesis.lat e do seu conteúdo público."
  sections:
    - title: "1. Aceitação"
      text:
        - "Ao acessar este site, você concorda com estes termos. Se não concordar, por favor não use o site."
    - title: "2. Conteúdo do site"
      text:
        - >-
          A LESIS disponibiliza este site para informação geral sobre suas pesquisas, serviços e publicações. O conteúdo tem caráter apenas informativo e não constitui aconselhamento jurídico, financeiro, de segurança ou de qualquer outra natureza profissional. O site pode mudar sem aviso prévio.
    - title: "3. Propriedade intelectual"
      text:
        - >-
          Salvo indicação em contrário, os textos, o design, os logos, as imagens e os demais materiais deste site pertencem à LESIS ou aos seus licenciadores. Você pode visualizar o site e compartilhar links para ele com finalidades lícitas e informativas. Não reproduza, modifique, distribua nem use nossos materiais comercialmente sem permissão por escrito.
    - title: "4. Uso aceitável"
      text:
        - >-
          Você não deve usar o site de forma indevida, interferir em seu funcionamento, tentar acesso não autorizado, introduzir código malicioso ou usar seu conteúdo para violar qualquer lei ou direito de terceiros.
    - title: "5. Links externos"
      text:
        - >-
          Este site pode conter links para sites e serviços de terceiros. Esses links são fornecidos por conveniência. A LESIS não controla nem endossa conteúdo de terceiros e não é responsável pela disponibilidade, pela segurança ou pelos termos deles.
    - title: "6. Isenções e responsabilidade"
      text:
        - >-
          O site é fornecido “conforme disponível”. Na medida permitida por lei, a LESIS não garante que o site ou seu conteúdo sejam completos, atuais, ininterruptos ou livres de erros. A LESIS não se responsabiliza por perdas decorrentes da confiança no conteúdo público do site ou do uso de serviços vinculados.
    - title: "7. Contato e alterações"
      text:
        - >-
          Dúvidas sobre estes termos podem ser enviadas para <a href="mailto:contact@lesis.lat">contact@lesis.lat</a>. Podemos atualizar estes termos periodicamente; a data no topo desta página identifica a versão vigente.
