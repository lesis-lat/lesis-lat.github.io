# --- Home page ----------------------------------------------------------------
home:
  hero:
    eyebrow: "A Plataforma LESIS"
    title: "Uma plataforma de cibersegurança AI-native <span class='hero-title-sub'>para todo o seu programa.</span>"
    lead: >-
      Vulnerabilidades, código, superfície de ataque, conhecimento e incidentes.<br>A IA verifica cada achado antes de ele chegar ao seu time, e os engenheiros da LESIS respondem por cada decisão.
    see_platform: "Conheça a plataforma"
    screen: "Security posture"
    alt: "A página de postura de segurança da LESIS: achados com prazo vencido, tempo de correção e os pontos de atenção que pedem uma decisão."
    video_alt: "Um passeio pela LESIS: da página de postura de segurança à lista de vulnerabilidades, um achado crítico com sua árvore de ataque e evidência, os indicadores de correção e de volta à postura."
    caption: "Telas do produto, com uma organização fictícia"

  clients:
    label: "Organizações que a LESIS já ajudou a proteger"
    title: "Quem já ajudamos a proteger"
    empty: "Fintechs, varejo, saúde, telecomunicações e lawtechs"

  what:
    eyebrow: "Por que a LESIS"
    display: "Times de segurança não precisam de mais alertas. Precisam de achados com alguém por trás."
    text:
      - >-
        A maioria dos programas de segurança roda numa colcha de retalhos: um scanner aqui, uma planilha de achados ali, o PDF de uma consultoria, um runbook no drive de alguém. Ninguém consegue dizer, a qualquer momento, o que está aberto, quem é o responsável e se está melhorando.
      - >-
        A LESIS troca a colcha de retalhos por um só registro. Cada achado tem evidência, um responsável e um prazo. A IA lê o seu código e reporta só o que consegue provar. Os engenheiros da LESIS decidem o que precisa de uma pessoa. A liderança vê postura, não ruído.

  media:
    pause: "Pausar animação"
    play: "Reproduzir animação"

  platform:
    eyebrow: "A plataforma"
    title: "Tudo em que o seu programa de segurança roda."
    intro: >-
      Todas as capacidades rodam sobre os mesmos dados, para que um achado no código, um threat model e um incidente apontem para os mesmos sistemas e as mesmas pessoas.
    features:
      - label: "Postura e análises"
        title: "Saiba onde você está, a qualquer momento."
        text: "Doze meses de achados abertos, corrigidos e fechados, tempo de correção por severidade e os pontos de atenção que pedem uma decisão agora, cada um com o motivo e o próximo passo."
        points: ["Postura de segurança e saúde da remediação", "Pontos de atenção com próximo passo", "Quanto vale o que o seu programa encontrou", "Benchmark com organizações comparáveis"]
        image: "analytics"
        height: 1100
        screen: "Analytics"
        alt: "A página de análises da LESIS: ao percorrer doze meses de achados abertos, resolvidos e fechados aparecem os números de cada mês e, depois, o tempo médio de correção por severidade."
      - label: "Gestão de vulnerabilidades"
        title: "Cada achado, da primeira evidência à prova da correção."
        text: "Um ciclo de vida de oito estados, um prazo definido pela severidade, evidências e comentários no próprio achado e árvores de ataque desenhadas a partir da análise. Remediadores fazem o achado andar; fechá-lo cabe a um analista."
        points: ["Prazos por severidade, definidos pela sua organização", "Árvores de ataque no achado", "Compartilhe um achado com um convidado externo", "Retestes automáticos para achados de código"]
        image: "finding"
        height: 1280
        screen: "Vulnerabilities"
        alt: "Um achado crítico na LESIS: passa de Identified para Fixing e depois mostra evidência, impacto, recomendação, histórico de estados e a conversa entre a analista da LESIS, a liderança de segurança e o engenheiro."
      - label: "Segurança de código"
        title: "Revisão de código que precisa provar."
        text: "Conecte GitHub, GitLab ou Bitbucket com acesso somente leitura. A IA mapeia cada aplicação, segue o dado até onde ele é usado e reporta só o que uma segunda revisão, mais forte, confirma. Segredos são avaliados sem que o valor seja lido."
        points: ["Conexões somente leitura, sempre sincronizadas", "Revisão de código com IA, verificada antes de reportar", "Varredura de segredos que nunca vê o valor", "Só o que mudou é lido de novo"]
        image: "repositories"
        height: 900
        screen: "Code repositories"
        alt: "Repositórios de código na LESIS: ao abrir o payments-api aparecem a varredura de segredos e a revisão de código por IA, em que cinco possíveis vulnerabilidades passaram por uma segunda revisão e uma foi confirmada, e depois os achados ligados a ele."
      - label: "Cadeias de exploração e causas raiz"
        title: "Veja como os achados viram ataques reais."
        text: "A IA encadeia achados abertos em caminhos de ataque e os agrupa pela correção que compartilham. Analistas editam, acrescentam ou descartam cada passo, e cada mudança fica marcada com quem a fez."
        points: ["Caminhos de ataque entre achados e ativos", "Causas raiz que fecham vários achados de uma vez", "Passos editados ou criados por pessoas, sinalizados", "Modo apresentação e exportação em YAML"]
        image: "exploit-chains"
        height: 950
        screen: "Exploit chains"
        alt: "Cadeias de exploração na LESIS: ao selecionar um caminho de ataque que vai do controle do admin do lojista aos dados de cartão, ele se destaca no grafo; um passo mostra de onde é alcançado e para onde leva; e o caminho abre com seus sete passos e evidências."
      - label: "Superfície de ataque"
        title: "Cada ativo, cada repositório e como eles se ligam."
        text: "Um inventário do que você tem e de onde o código vive, desenhado como um grafo com os achados abertos em cada recurso. Sistemas expostos à internet ficam marcados, e os vínculos que você registra ficam separados dos que a análise deduz."
        points: ["Ativos e repositórios, vinculados", "Achados abertos em cada recurso", "Sistemas expostos à internet marcados", "Vínculos registrados e deduzidos, separados"]
        image: "resource-graph"
        height: 1000
        screen: "Resource graph"
        alt: "O grafo de recursos da LESIS em uso: ao selecionar o gateway de pagamentos aparecem seu ambiente, criticidade e conexões; com as vulnerabilidades como nós, uma ligada ao gateway abre como achado, com sua evidência."
      - label: "Conhecimento"
        title: "Suas políticas e threat models, ligados ao trabalho."
        text: "Políticas, procedimentos, playbooks, runbooks e threat models ficam ao lado dos achados que explicam. Mencione um achado, ativo, repositório ou investigação e ele fica vinculado ao documento. Árvores de ataque são desenhadas na própria página e podem ser apresentadas ou exportadas."
        points: ["Políticas, procedimentos, playbooks, runbooks e threat models", "Menções que vinculam achados, ativos e repositórios", "Árvores de ataque desenhadas no documento", "Busca em linguagem simples em todos os documentos"]
        image: "knowledge"
        height: 1300
        screen: "Knowledge"
        alt: "Um threat model no Knowledge da LESIS: ao passar o mouse sobre os ativos e achados mencionados, aparece uma prévia de cada um, com severidade, status e uma descrição curta."
      - label: "Seu consultor"
        title: "Um engenheiro com nome, a um clique."
        text: "A sua organização tem um consultor da LESIS dentro da plataforma: um engenheiro de segurança que conhece os seus sistemas, revisa o que a IA propõe e entra com o seu time quando uma correção precisa de um segundo par de olhos. Mande um e-mail ou agende uma conversa sem sair da LESIS."
        points: ["Um engenheiro da LESIS com nome, dedicado à sua organização", "Perfil, e-mail e link de agenda dentro do app", "Revisa propostas da IA e correções com o seu time", "Ao lado do assistente, na tela inicial"]
        image: "advisor"
        height: 900
        screen: "Home"
        alt: "A tela inicial da LESIS: ao selecionar a consultora da organização, o perfil dela abre ao lado, com bio, e-mail e opções de agenda."

  ai:
    eyebrow: "IA com salvaguardas"
    title: "IA que precisa provar <br>antes de avisar."
    intro: >-
      Toda funcionalidade de IA da LESIS segue as mesmas regras. É por causa delas que uma lista curta de achados merece confiança, e que a IA nunca vira o lugar onde uma decisão é tomada.
    items:
      - title: "Prova antes do achado"
        text: "Uma suspeita só vira achado quando todas as revisões confirmam como um atacante chega até ela. As de severidade alta e crítica são verificadas duas vezes."
      - title: "Ela nunca vê um segredo"
        text: "Credenciais candidatas são avaliadas pelo código ao redor. O valor fica mascarado na tela e é removido antes de o código chegar a um modelo."
      - title: "Custo de IA às claras"
        text: "Tokens e custo estimado de cada recurso de IA, por organização e modelo, para o uso nunca ser uma surpresa."
      - title: "A IA propõe, pessoas decidem"
        text: "Cadeias de exploração, causas raiz e registros sugeridos ficam como rascunho até um analista confirmar, editar ou descartar, e cada mudança mostra quem a fez."
      - title: "Prova da correção também"
        text: "Quando um achado de código vai para Retest, a IA o confere contra o código atual e publica o resultado no próprio achado."

  api:
    eyebrow: "API"
    title: "Seu programa, programável."
    intro: >-
      Uma API REST documentada cobre a plataforma, para que os achados fluam para os seus tickets, o seu SIEM e o seu data warehouse, e para que os seus próprios agentes de IA trabalhem com os mesmos registros que o seu time vê, com as mesmas permissões.
    points: ["Uma API REST documentada para cada módulo", "Chaves vinculadas a uma organização e às permissões de quem as criou", "Escopos de leitura e escrita, validade e revogação", "Um guia para agentes de IA, para baixar em Markdown"]
    soon_label: "Em breve"
    soon_tag: "Em breve"
    soon:
      - title: "LESIS CLI"
        text: "Consulte e atualize o seu programa pelo terminal e pelos seus pipelines de CI."
      - title: "Servidor MCP da LESIS"
        text: "Dê aos seus assistentes de IA e agentes de código acesso governado aos seus achados, dentro das permissões da chave."
    code_title: "Listar achados críticos e altos fora do SLA"
    code_label: "Exemplo de requisição à API listando achados críticos e altos fora do SLA, e a resposta em JSON."

  enterprise:
    eyebrow: "Enterprise"
    title: "Feita para organizações <br>com mais de um de tudo."
    intro: >-
      Subsidiárias, unidades de negócio, pesquisadores externos e auditores, cada um com exatamente o acesso de que precisa, e um registro de tudo o que fizeram.
    items:
      - title: "Multiorganização"
        text: "Opere cada unidade de negócio ou subsidiária como uma organização própria, com os seus prazos, e veja todas juntas quando precisar."
      - title: "Papéis que refletem o seu trabalho"
        text: "Oito papéis, de administrador a analista, remediador e convidado. O servidor garante cada um deles."
      - title: "Trilha de auditoria completa"
        text: "Cada escrita em cada módulo, registrada com a conta que a fez e quando."
      - title: "Acesso de convidados"
        text: "Compartilhe um único achado ou investigação com um convidado externo, só para leitura, sem abrir o resto do programa."
      - title: "Benchmark"
        text: "Métricas de remediação comparadas com organizações semelhantes na plataforma, sem nomear nenhuma delas."
      - title: "O valor do programa"
        text: "Quanto vale o que o seu programa encontrou, calculado a partir do valor que a sua organização dá a cada severidade."
      - title: "Login em duas etapas"
        text: "Senha e código de uso único, com contas novas aprovadas por um administrador antes de poder entrar."
      - title: "Privilégio mínimo no seu código"
        text: "Acesso somente leitura aos repositórios, tokens de varredura limitados a um repositório e credenciais guardadas criptografadas."
      - title: "Prazos que você define"
        text: "Janelas de correção por severidade em cada organização, com todo achado vencido sinalizado antes que alguém pergunte."

  people:
    eyebrow: "Especialistas à disposição"
    display: "Engenheiros por trás de cada achado."
    text: >-
      A LESIS é construída e sustentada por um laboratório de pesquisa em segurança. A sua organização tem um consultor da LESIS com nome, e os mesmos engenheiros revisam o que a IA propõe, fazem a triagem do que pesquisadores externos enviam e conduzem avaliações mais profundas quando um sistema precisa.
    items:
      - title: "Seu consultor"
        text: "Um engenheiro da LESIS com nome, dedicado à sua organização, acessível de dentro da plataforma e que conhece o seu contexto."
      - title: "Decisões que a IA não toma"
        text: "Analistas confirmam ou descartam o que a IA propõe, e testam o que a revisão de código não alcança."
      - title: "Triagem da divulgação"
        text: "Cada relato de um pesquisador externo passa pela triagem da LESIS antes de chegar ao seu time."
      - title: "Avaliações"
        text: "Pesquisa de vulnerabilidades, revisão de arquitetura e investigação de incidentes, com cada achado entrando no mesmo registro."

  ways:
    title: "Formas de usar a LESIS"
    intro: >-
      Use a plataforma com o seu próprio time, ou deixe a LESIS operar o seu programa nela, junto com você. Nos dois casos o registro é seu, e os engenheiros por trás dele são os mesmos.
    platform:
      title: "Plataforma"
      lead:
        - "O seu time opera o programa na LESIS."
        - >-
          Todas as capacidades para a sua organização: postura e análises, gestão de vulnerabilidades, segurança de código, cadeias de exploração e causas raiz, superfície de ataque e conhecimento. A IA faz a leitura, e o seu consultor da LESIS está por perto quando uma decisão precisa de uma segunda opinião.
    managed:
      title: "Gerenciado"
      lead:
        - "A LESIS opera o seu programa de segurança na plataforma, ao lado do seu time."
        - >-
          Achados triados, cobrados, retestados e fechados. Relatos de divulgação triados conforme chegam. Inventário, runbooks e políticas mantidos em dia; campanhas de conscientização e treinamentos levados até o fim; o trust center sempre pronto; a postura reportada em comparação com organizações semelhantes. O que você contribui não é headcount, é acesso: os seus engenheiros agem quando agir importa, e o que aprendem entra no registro enquanto trabalham.
    partners: >-
      Consultorias podem entregar a LESIS com a própria marca, ou indicar clientes para nós, pelo <a href="{partnership_url}">Programa de Parcerias LESIS</a>, sem montar um time interno.

  record:
    eyebrow: "Histórico"
    title: "Engenheiros que você pode verificar"
    intro: >-
      O julgamento na LESIS vem de pessoas com histórico público: divulgações de vulnerabilidades, experiência em grandes empresas de tecnologia e contribuições à comunidade de segurança por meio de competições e palestras em conferências.
    items:
      - title: "Vulnerabilidades publicadas"
        text: >-
          Membros da nossa equipe reportaram vulnerabilidades à D-Link, documentadas na <a href="https://nvd.nist.gov/vuln/detail/CVE-2020-9376" target="_blank" rel="noopener noreferrer">CVE-2020-9376</a> e na <a href="https://nvd.nist.gov/vuln/detail/CVE-2020-9377" target="_blank" rel="noopener noreferrer">CVE-2020-9377</a>, e ao MISP, registrada como <a href="https://nvd.nist.gov/vuln/detail/CVE-2020-28043" target="_blank" rel="noopener noreferrer">CVE-2020-28043</a>. O trabalho deles também inclui reportes à Oracle e à Apple, com registros públicos no <a href="https://www.oracle.com/security-alerts/cpujul2022.html" target="_blank" rel="noopener noreferrer">Critical Patch Update de julho de 2022 da Oracle</a> e nos <a href="https://support.apple.com/en-gb/102774" target="_blank" rel="noopener noreferrer">agradecimentos de segurança de servidores web da Apple</a>.
      - title: "Competições de CTF"
        text: >-
          Membros da nossa equipe competiram em eventos de Capture The Flag, conquistando o primeiro lugar no CTF da BSides São Paulo e vencendo uma etapa classificatória do Hackaflag. A LESIS também apoia equipes da comunidade: no <a href="https://www.sbseg2026.uff.br/" target="_blank" rel="noopener noreferrer">SBSeg 2026</a>, a equipe do GRIS/UFRJ, apoiada pela LESIS, <a href="{bulletin_url}">ficou em primeiro lugar entre 18 equipes</a> em desafios de análise de tráfego, forense e investigação de incidentes.
      - title: "Experiência em líderes de mercado"
        text: >-
          Nossa equipe inclui engenheiros que trabalharam em empresas como o Nubank, o maior banco digital da América Latina, e a Globo, a maior empresa de mídia do Brasil, além dos principais fornecedores de cibersegurança do país e de outras empresas igualmente fortes, ainda que menos conhecidas. Eles trazem para o trabalho na LESIS a experiência com as exigências de engenharia de sistemas que atendem milhões de pessoas.
      - title: "Palestras em eventos de segurança"
        text: >-
          Membros da nossa equipe já apresentaram palestras em eventos como BxSec, Roadsec, BSides Rio de Janeiro e XibéSec. Essas contribuições levam a experiência da nossa equipe a discussões com outros profissionais de segurança e ajudam a compartilhar conhecimento na comunidade brasileira de segurança.

  work:
    transition: "Explore nossas pesquisas publicadas e ferramentas open source."
    tool: "Ferramenta open source"
    no_release: "Nenhuma versão publicada"
    tools:
      security_gate: "Aplique limites de segurança configuráveis aos alertas do GitHub para que sua equipe possa impor verificações no pipeline de CI/CD."
      bunkai: "Examine as dependências de projetos Perl em busca de módulos desatualizados e vulnerabilidades conhecidas, com resultados que se encaixam nos fluxos de desenvolvimento."
      kasumi: "Extraia e pesquise mensagens do Slack por palavra-chave e período para apoiar avaliações de segurança autorizadas."
    all_publications: "Todas as publicações &rarr;"
    explore_tools: "Conheça nossas ferramentas &rarr;"

  closing:
    title: ["Uma plataforma", "para todo o programa.", "Veja no seu."]
    text: >-
      Na demo, mostramos a plataforma com uma organização fictícia e depois falamos da sua: o que você opera, quem cuida disso e onde os seus achados estão hoje.

