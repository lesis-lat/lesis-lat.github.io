# --- Partnership ----------------------------------------------------------------
partnership:
  eyebrow: "Programa de Parcerias"
  title: "Amplie suas capacidades em cibersegurança com a LESIS."
  lead:
    - "O Programa de Parcerias da LESIS permite que empresas incorporem serviços especializados de cibersegurança ao seu portfólio sem precisar montar uma equipe interna de segurança ou investir em infraestrutura adicional."
    - "Por meio de modelos flexíveis de colaboração, os parceiros podem oferecer os serviços da LESIS com a própria marca, combinar nossa expertise com as soluções que já oferecem ou indicar clientes que precisam de suporte especializado em segurança."
  become: "Seja um parceiro"
  subject: "Parceria"
  levels_link: "Níveis de parceria"
  benefits:
    title: "Benefícios"
    intro: "O parceiro soma nossos engenheiros, nossa pesquisa e nossa plataforma ao que já oferece, e mantém o relacionamento com o cliente."
    items:
      - title: "Expertise especializada"
        text: "Acesse pesquisadores e consultores de segurança experientes para apoiar projetos complexos e críticos."
      - title: "Portfólio ampliado"
        text: "Adicione avaliações de segurança, pesquisa de vulnerabilidades, consultoria e ferramentas sob medida ao que você já oferece."
      - title: "Modelos flexíveis"
        text: "Escolha entre entrega white-label, parcerias de indicação ou ofertas de serviço integradas."
      - title: "Sem infraestrutura adicional"
        text: "Amplie suas capacidades em cibersegurança sem criar e manter uma equipe especializada interna."
      - title: "Suporte técnico e comercial"
        text: "Conte com suporte na avaliação de oportunidades, na definição de escopo, na elaboração de propostas e na entrega técnica."
      - title: "Soluções personalizadas"
        text: "Combine os serviços da LESIS com as suas próprias capacidades para criar ofertas sob medida para cada cliente."
  levels:
    title: "Níveis de parceria"
    intro: "O programa é estruturado em quatro níveis, com base no engajamento, nas oportunidades de negócio e na colaboração de cada parceiro com a LESIS."
    items:
      - name: "Bronze"
        text:
          - "O nível de entrada para empresas que estão começando a parceria com a LESIS."
          - "Inclui acesso aos materiais padrão de parceria, uma apresentação dos serviços da LESIS e suporte durante o processo inicial de vendas."
      - name: "Prata"
        text:
          - "Pensado para parceiros que estão desenvolvendo oportunidades recorrentes com a LESIS."
          - "Inclui todos os benefícios do nível Bronze, suporte comercial adicional e a participação da LESIS em reuniões selecionadas com clientes."
      - name: "Ouro"
        text:
          - "Para parceiros estabelecidos que trabalham de perto com a LESIS em oportunidades de cibersegurança."
          - "Inclui todos os benefícios dos níveis anteriores, suporte técnico ampliado e a possibilidade de desenvolver conteúdo co-branded e iniciativas conjuntas."
      - name: "Platina"
        text:
          - "O nível mais alto de parceria, pensado para relações estratégicas e de longo prazo."
          - "Inclui todos os benefícios dos níveis anteriores, suporte prioritário, colaboração mais próxima com a equipe da LESIS, acesso a iniciativas selecionadas e oportunidades de visibilidade conjunta em eventos e campanhas de co-marketing."
    note: "Os níveis de parceria e os critérios de elegibilidade são avaliados individualmente, com base no perfil, no engajamento e no relacionamento do parceiro com a LESIS."
  closing:
    title: ["Construa ofertas", "de segurança mais fortes", "com a LESIS."]
    text: "Seja para ampliar seu portfólio de serviços, entregar projetos de cibersegurança com a sua marca ou conectar seus clientes a expertise especializada em segurança, podemos ajudar você a definir o modelo de parceria certo."
    button: "Seja um parceiro da LESIS"

# --- Sobre: /pt/about/ ----------------------------------------------------------
about:
  hero:
    eyebrow: "Sovereign AI Lab for Cybersecurity"
    title: ["Pesquisa independente.", "Inteligência soberana.", "Capacidades cibernéticas avançadas."]
    lead: "Pesquisamos e desenvolvemos IA que organizações e governos podem possuir, operar e evoluir por conta própria."
    thesis_link: "Leia a tese"
  origin:
    eyebrow: "01 &middot; De onde viemos"
    title: "Tudo começou com pesquisa."
    quote: "We are an applied security research firm, focused on developing effective offensive technology to support critical operations."
    source: "lesis.lat, maio de 2024. A primeira frase que publicamos."
    text: "A LESIS foi fundada por pessoas que escreviam os próprios fuzzers, analisadores e exploits para responder ao que os scanners prontos não respondiam. Quando o instrumento de que precisávamos não existia, construí-lo era o trabalho."
  shift:
    eyebrow: "02 &middot; O que mudou"
    title: "Então o instrumento mudou."
    text:
      - "Os modelos de linguagem são hoje o mais poderoso que a segurança já teve. Eles leem código numa escala que nenhum time alcança, e os mais fortes, liberados só para defensores verificados como a LESIS, encontram falhas escondidas há décadas."
      - "Mesmo assim, quase todo mundo os usa do mesmo jeito: alugados de um punhado de provedores, nas condições deles, com código e incidentes enviados para onde quer que o modelo rode. Uma inteligência que só se pode alugar pertence a quem é dono dela, e o mesmo vale para cada decisão tomada com ela."
  thesis:
    eyebrow: "03 &middot; No que acreditamos"
    display: "Cibersegurança exige uma inteligência que as organizações consigam entender, controlar e na qual possam confiar."
    items:
      - title: "Entender"
        text: "Cada resultado traz a sua evidência, e tudo o que um modelo contribui fica marcado como dele. Uma pessoa sempre consegue ver o que foi encontrado, como e por quem."
      - title: "Controlar"
        text: "Quem roda um modelo decide o que ele vê, o que guarda e quando muda. Essa decisão tem de ser da organização que depende dele, não do fornecedor que o vende."
      - title: "Confiar"
        text: "Confiança vem de prova, não de fluência. Um modelo pode propor, mas nada vira achado até que uma pessoa o confira e responda por ele."
  sovereignty:
    eyebrow: "04 &middot; O que soberania significa"
    title: "Independência que se pode inspecionar."
    intro: "Cinco coisas a tornam real: os modelos, os dados, a infraestrutura, a propriedade intelectual e a forma como as capacidades de IA evoluem. Nenhuma delas exige um foundation model criado do zero. Veja onde estamos em cada uma."
    today_label: "Hoje"
    building_label: "Construindo"
    items:
      - name: "Modelos"
        today: "Agnósticos por design. A LESIS roda modelos fechados, como Claude e GPT, e modelos open-weight, como DeepSeek e GLM. Você escolhe qual cuida de cada tarefa; o controle é seu."
        building: "Modelos especializados em trabalho de segurança, adaptados de modelos open-weight e testados em achados reais."
      - name: "Dados"
        today: "Valores de segredos são mascarados antes de qualquer modelo vê-los, repositórios são conectados só para leitura, e cada chamada a um modelo é registrada com o modelo, a tarefa e o custo."
        building: "Pipelines que mantêm o material sensível onde ele pertence, para que só saia o que a organização aprovar."
      - name: "Infraestrutura"
        today: "A plataforma e modelos open-weight, como DeepSeek e GLM, rodam dentro da infraestrutura da própria organização, e nada sai dela. Uma instalação completa em nuvem, da rede aos backups, está escrita como código."
        building: "Inferência em infraestrutura operada pela LESIS e instalações em redes sem acesso à internet."
      - name: "Propriedade intelectual"
        today: "A plataforma, os seus analisadores e os nossos métodos são feitos internamente, então o que aprendemos no caminho fica conosco."
        building: "Datasets tirados da nossa pesquisa, a matéria-prima de que os modelos especializados são feitos."
      - name: "Evolução"
        today: "Cada vez que um analista aceita ou rejeita um resultado da IA, isso fica registrado, o que nos dá um histórico contínuo de onde um modelo acerta e onde erra."
        building: "Um ciclo de avaliar, adaptar e reimplantar modelos no ritmo dos nossos clientes, não no calendário de lançamentos de outra empresa."
  agenda:
    eyebrow: "05 &middot; Onde aplicamos"
    title: "Só cibersegurança."
    intro: "Um modelo treinado com achados, exploits e correções reais sabe coisas que um treinado com a internet aberta não sabe. Por isso o laboratório trabalha com segurança e mais nada."
    items:
      - title: "Segurança ofensiva"
        text: "Modelos e ferramentas que encontram e encadeiam vulnerabilidades, levam fuzzers a caminhos que outros não alcançam e validam exploits em ambientes isolados."
      - title: "Defesa"
        text: "Revisão de código, causas raiz que fecham vários achados de uma vez e retestes que confirmam que uma correção se mantém enquanto o código muda."
      - title: "Inteligência cibernética"
        text: "Achados, ativos, incidentes e caminhos de ataque reunidos num único retrato de exposição sobre o qual a organização consegue agir."
      - title: "Avaliação"
        text: "Benchmarks e conjuntos de teste para tarefas de segurança, para que qualquer modelo que usamos ou construímos seja julgado no trabalho que deve fazer."
  record:
    eyebrow: "06 &middot; Histórico"
    title: "Trabalho que dá para verificar."
    items:
      - title: "Divulgação de vulnerabilidades"
        text: "<a href=\"https://nvd.nist.gov/vuln/detail/CVE-2020-9376\" target=\"_blank\" rel=\"noopener noreferrer\">CVE-2020-9376</a> e <a href=\"https://nvd.nist.gov/vuln/detail/CVE-2020-9377\" target=\"_blank\" rel=\"noopener noreferrer\">CVE-2020-9377</a> na D-Link, <a href=\"https://nvd.nist.gov/vuln/detail/CVE-2020-28043\" target=\"_blank\" rel=\"noopener noreferrer\">CVE-2020-28043</a> no MISP, e reportes creditados pela <a href=\"https://www.oracle.com/security-alerts/cpujul2022.html\" target=\"_blank\" rel=\"noopener noreferrer\">Oracle</a> e pela <a href=\"https://support.apple.com/en-gb/102774\" target=\"_blank\" rel=\"noopener noreferrer\">Apple</a>."
      - title: "Competições"
        text: "Primeiro lugar no CTF da BSides São Paulo, vitória numa eliminatória do Hackaflag, e o time GRIS/UFRJ, apoiado pela LESIS, <a href=\"{bulletin_url}\">primeiro entre 18</a> no SBSeg 2026."
      - title: "Open source"
        text: "<a href=\"https://github.com/lesis-lat/security-gate\" target=\"_blank\" rel=\"noopener noreferrer\">Security Gate</a>, <a href=\"https://github.com/lesis-lat/bunkai\" target=\"_blank\" rel=\"noopener noreferrer\">Bunkai</a> e <a href=\"https://github.com/lesis-lat/kasumi\" target=\"_blank\" rel=\"noopener noreferrer\">Kasumi</a>, ferramentas que o time constrói e mantém abertas, para qualquer pessoa usar e auditar."
      - title: "Palestras"
        text: "Apresentações na BxSec, Roadsec, BSides Rio de Janeiro e XibéSec, compartilhadas com a comunidade brasileira de segurança."
  closing:
    title: ["A sua infraestrutura.", "A sua inteligência.", "A sua soberania."]
    text: "IA moderna, sem entregar os seus sistemas mais sensíveis a terceiros."
    research: "Leia a nossa pesquisa"
    signoff: "Sovereign Intelligence. Secure Futures."

# --- Modelos de fronteira: /mythos/, /daybreak/, /frontier-models/ ------------
frontier:
  request: "Solicitar acesso"
  how_link: "Como funciona"
  stats_eyebrow: "Os números"
  access_eyebrow: "Acesso"
  sources_title: "Fontes"
  note: "O Claude Mythos é desenvolvido pela Anthropic e o Daybreak é um programa da OpenAI. Os nomes aparecem aqui só para descrever o acesso que a LESIS oferece. Os números são os publicados pela Anthropic e pela OpenAI ou noticiados pela imprensa."
  how:
    eyebrow: "Como a LESIS opera"
    title: "Você recebe os achados. <br>A gente cuida do modelo."
    intro: >-
      Acesso, escopo, capacidade computacional e os engenheiros que conferem cada resultado vêm da LESIS. O que chega ao seu time é uma lista curta de vulnerabilidades provadas, cada uma com um jeito de corrigir.
    steps:
      - title: "Escopo e autorização"
        text: "Definimos o que entra no escopo, de repositórios a aplicações e infraestrutura, com a autorização por escrito que esses programas exigem. Nada roda fora dele."
      - title: "A IA encontra, a LESIS prova"
        text: "O modelo lê o seu código e os seus sistemas como um atacante leria. Os engenheiros da LESIS reproduzem cada resultado antes de ele contar, então você recebe vulnerabilidades, não suspeitas."
      - title: "Direto no seu registro"
        text: "Cada achado provado entra na plataforma LESIS com evidência, severidade, um responsável e um prazo, ao lado do resto do seu programa."
      - title: "Corrigido e retestado"
        text: "Quando o seu time publica a correção, rodamos a verificação de novo e só fechamos o achado quando a brecha não existe mais."
  pages:
    mythos:
      subject: "Acesso ao Mythos"
      eyebrow: "Claude Mythos, operado pela LESIS"
      title: "O seu caminho até o Mythos."
      lead:
        - "A Anthropic criou um modelo que encontra e explora vulnerabilidades sozinho e decidiu que o público não deveria tê-lo. O Claude Mythos é reservado às empresas por trás do software crítico do mundo e a um grupo pequeno de organizações de segurança verificadas."
        - "A LESIS é uma dessas organizações, verificada pela Anthropic no seu Cyber Verification Program. Rodamos o Mythos no seu código e nos seus sistemas, provamos o que ele encontra e entregamos as correções ao seu time."
      stats:
        - value: "Milhares"
          text: "de zero-days de alta severidade encontrados em poucas semanas, em todos os grandes sistemas operacionais e navegadores."
        - value: "27 anos"
          text: "que uma falha capaz de derrubar qualquer máquina OpenBSD passou despercebida, até o Mythos ler o código."
        - value: "5 milhões"
          text: "de vezes que testes automatizados passaram pela linha do FFmpeg que escondia um bug de 16 anos encontrado pelo Mythos."
        - value: "83,1%"
          text: "na reprodução de vulnerabilidades do CyberGym, contra 66,6% do Claude Opus 4.6."
      speech:
        eyebrow: "Por que importa"
        display: "Cada linha de código que você já publicou está prestes a ser lida por algo que nunca se cansa."
        text:
          - >-
            Em poucas semanas, o Mythos encontrou milhares de vulnerabilidades de alta severidade em todos os grandes sistemas operacionais e navegadores. Uma falha no OpenBSD, com 27 anos, que deixava qualquer pessoa derrubar uma máquina só de se conectar a ela. Um bug no FFmpeg, com 16 anos, numa linha que testes automatizados tinham executado cinco milhões de vezes. Bugs do kernel Linux encadeados de um usuário comum até o controle total da máquina. Quase tudo sem nenhum humano conduzindo.
          - >-
            Nenhum desses bugs era novo. O que mudou foi o custo de encontrá-los. Uma capacidade assim não fica muito tempo em um só laboratório, e quando chegar aos atacantes, o tempo entre uma falha e o seu exploit cai para horas. As organizações que passarem por isso bem serão aquelas cujo código um modelo assim leu primeiro, do lado delas.
      access:
        title: "Por que não dá para simplesmente se cadastrar."
        text: >-
          A Anthropic não vende o Mythos ao público. Ela dá acesso aos parceiros do Project Glasswing, as empresas que constroem e mantêm software crítico, e a organizações de segurança verificadas pelo seu Cyber Verification Program, com regras sobre como o modelo é usado. A LESIS passou por essa verificação, então você recebe o que o Mythos encontra sem se candidatar, esperar aprovação ou montar um time para operá-lo.
      closing:
        title: ["Deixe o Mythos ler o seu código", "antes que o modelo", "de outra pessoa leia."]
        text: "Conte o que você opera. Nós dizemos por onde o Mythos deve começar e em quanto tempo ele pode rodar."
    daybreak:
      subject: "Acesso ao Daybreak"
      eyebrow: "OpenAI Daybreak, operado pela LESIS"
      title: "O seu caminho até o Daybreak."
      lead:
        - "A OpenAI agora dedica uma parte significativa da sua capacidade computacional de fronteira a encontrar e corrigir vulnerabilidades, e reserva os modelos que fazem isso para defensores aprovados. O Daybreak é como esses defensores chegam até eles."
        - "A LESIS é verificada pela OpenAI para o Daybreak. Apontamos esses modelos para o seu código e os seus sistemas, provamos o que eles encontram e entregamos as correções ao seu time."
      stats:
        - value: "948"
          text: "possíveis problemas no kernel Linux, cada um já com uma correção preparada."
        - value: "81"
          text: "vulnerabilidades novas encontradas no Firefox."
        - value: "2 níveis"
          text: "Daybreak Blue para descoberta e resposta; Daybreak Red para modelos treinados para cibersegurança e validação de exploits."
        - value: "US$ 1 bilhão"
          text: "comprometido pela OpenAI com quem defende infraestrutura crítica."
      speech:
        eyebrow: "Por que importa"
        display: "A computação de fronteira agora está apontada para vulnerabilidades. A única pergunta é quem a aponta primeiro para as suas."
        text:
          - >-
            O Daybreak dá a defensores aprovados os modelos mais capazes da OpenAI, com salvaguardas ajustadas para trabalho de segurança. O Daybreak Blue é para descoberta e resposta a incidentes. O Daybreak Red acrescenta modelos treinados para cibersegurança, feitos para pesquisa de vulnerabilidades e validação de exploits. Apontados para o kernel Linux, prepararam correções para 948 possíveis problemas. Apontados para o Firefox, encontraram 81 vulnerabilidades novas.
          - >-
            O objetivo declarado da OpenAI é colocar inteligência de fronteira nas mãos de defensores confiáveis antes que atacantes consigam usar IA ofensiva em escala, e ela chama o tempo que resta para isso de uma janela que está se fechando. Os bugs que esses modelos encontram já estão no seu código. Alguém vai lê-lo com um modelo assim. Que seja você.
      access:
        title: "Feito para defensores aprovados."
        text: >-
          O Daybreak só está aberto a pessoas e organizações que a OpenAI aprova para trabalho de segurança autorizado, e contas individuais precisam entrar com chaves de segurança físicas. A LESIS passou por essa verificação, cumpre esses requisitos e executa o trabalho por você, então o seu time recebe os resultados sem o processo de candidatura nem a carga operacional.
      closing:
        title: ["Modelos de fronteira", "já estão lendo código.", "Garanta que leiam o seu primeiro."]
        text: "Conte o que você opera. Nós dizemos por onde o Daybreak deve começar e em quanto tempo ele pode rodar."
    both:
      subject: "Acesso a modelos de fronteira"
      eyebrow: "Modelos de fronteira em cibersegurança"
      title: "Mythos e Daybreak, trabalhando para você."
      lead:
        - "A Anthropic e a OpenAI criaram, cada uma, modelos que encontram vulnerabilidades escondidas há décadas, e cada uma os reserva para defensores verificados: o Claude Mythos e o OpenAI Daybreak."
        - "A LESIS tem acesso aos dois. Rodamos ambos no seu código e nos seus sistemas, provamos cada resultado e colocamos o que eles encontram em um só registro, pronto para o seu time agir."
      stats:
        - value: "Milhares"
          text: "de zero-days de alta severidade encontrados pelo Claude Mythos em poucas semanas, em todos os grandes sistemas operacionais e navegadores."
        - value: "27 anos"
          text: "que a falha no OpenBSD encontrada pelo Mythos tinha passado despercebida."
        - value: "948"
          text: "possíveis problemas no kernel Linux, com correções preparadas pelos modelos do Daybreak, da OpenAI."
        - value: "81"
          text: "vulnerabilidades novas no Firefox encontradas pelos mesmos modelos."
      speech:
        eyebrow: "Por que agora"
        display: "A economia de encontrar vulnerabilidades acabou de quebrar."
        text:
          - >-
            Um bug de 27 anos no OpenBSD. Um bug de 16 anos no FFmpeg pelo qual os testes tinham passado mais de cinco milhões de vezes. Milhares de zero-days de alta severidade em todos os grandes sistemas operacionais e navegadores, vindos de um modelo, em semanas. Correções para 948 possíveis problemas no kernel Linux e 81 vulnerabilidades novas no Firefox, vindas de outro.
          - >-
            Esses bugs não eram novos. Estavam esperando algo paciente o bastante para ler cada linha, e isso agora existe dos dois lados da briga. Quem usa primeiro corrige o que os atacantes teriam encontrado. Os outros ficam sabendo por outra pessoa.
      compare:
        eyebrow: "Dois programas"
        title: "Dois laboratórios, duas leituras independentes do seu código."
        intro: >-
          Modelos de laboratórios diferentes são treinados de formas diferentes e deixam passar coisas diferentes. Rodar os dois dá a uma falha que um deles não vê uma segunda chance de ser pega, e evita que você dependa de um só fornecedor.
        access_label: "Acesso"
        strength_label: "Conhecido por"
        lesis_label: "LESIS"
        items:
          - name: "Claude Mythos"
            by: "Anthropic"
            access: "Parceiros do Project Glasswing e o Cyber Verification Program."
            strength: "Encontrar e encadear zero-days sozinho; 83,1% na reprodução de vulnerabilidades do CyberGym."
            lesis: "Verificada pela Anthropic no Cyber Verification Program."
            path: "/mythos/"
            link: "O seu caminho até o Mythos &rarr;"
          - name: "Daybreak"
            by: "OpenAI"
            access: "Daybreak Blue e Daybreak Red, para defensores aprovados."
            strength: "Modelos de fronteira ajustados para trabalho de segurança e modelos treinados para pesquisa de vulnerabilidades e validação de exploits."
            lesis: "Verificada pela OpenAI para o Daybreak."
            path: "/daybreak/"
            link: "O seu caminho até o Daybreak &rarr;"
      access:
        title: "Fechado ao público. <br>Aberto para você."
        text: >-
          Nenhum dos dois laboratórios vende esses modelos ao público. O acesso passa por verificação, regras de uso e, no Daybreak, chaves de segurança físicas. A LESIS já cumpre tudo isso, então você recebe o trabalho dos dois sem se candidatar a nenhum.
      closing:
        title: ["Dois modelos de fronteira.", "Um só registro.", "O seu código, lido primeiro."]
        text: "Conte o que você opera. Nós dizemos qual modelo deve começar, por onde e em quanto tempo."

# --- On-premises AI: /on-premises/ --------------------------------------------
onprem:
  subject: "IA on-premises"
  request: "Planejar a implantação"
  how_link: "Como funciona"
  eyebrow: "Modelos abertos na sua infraestrutura"
  title: "IA que nunca sai da sua rede."
  lead:
    - "A maior parte da IA para segurança funciona enviando o seu código para o modelo de outra empresa. Para um banco, um órgão de governo ou qualquer empresa que, por contrato, precisa manter o código-fonte dentro de casa, a conversa termina aí."
    - "A LESIS roda modelos open-weight, DeepSeek ou GLM, nos seus próprios servidores, ao lado da plataforma. Revisão de código, verificação e reteste acontecem dentro da sua rede, e nada é enviado a um provedor de IA externo."
  facts_eyebrow: "O que fica com você"
  facts:
    - value: "Local"
      text: "O modelo roda em servidores no seu data center ou na sua própria conta de nuvem, ao lado da plataforma LESIS."
    - value: "Zero"
      text: "chamadas a provedores de IA externos. Código, achados e prompts ficam dentro da sua rede."
    - value: "Aberto"
      text: "Os pesos do modelo são públicos, divulgados pela DeepSeek e pela Zhipu AI, então ele pode ser inspecionado e mantido na versão que você aprovou."
    - value: "Registrado"
      text: "Cada chamada ao modelo é registrada com o modelo e a tarefa, em logs que permanecem com você."
  speech:
    eyebrow: "Por que importa"
    display: "O código que você mais protege é justamente o que você menos pode mandar para fora."
    text:
      - >-
        Código-fonte, detalhes de incidentes e relatórios de vulnerabilidade estão entre os dados mais sensíveis de uma organização. Reguladores, clientes e contratos muitas vezes exigem que eles nunca saiam do controle dela, e um modelo hospedado por terceiros torna essa promessa difícil de cumprir: cada requisição leva um pedaço do seu código para um provedor e uma jurisdição que você não escolheu.
      - >-
        Modelos open-weight mudam isso. DeepSeek e GLM podem ser baixados e executados como qualquer outro software, sem nenhuma conexão com a empresa que os treinou. Rodar esses modelos na sua infraestrutura significa que a análise vai até o seu código, e o seu código fica onde está.
  models:
    eyebrow: "Os modelos"
    title: "DeepSeek ou GLM. <br>Você escolhe."
    intro: "Os dois estão entre os modelos open-weight mais fortes da atualidade. A LESIS roda qualquer um deles, ou os dois, e você decide qual cuida de cada tarefa."
    known_label: "Destaque"
    items:
      - name: "DeepSeek"
        by: "DeepSeek"
        known: "Raciocínio e código de alto nível com uma fração da capacidade computacional que modelos comparáveis exigem."
      - name: "GLM"
        by: "Zhipu AI"
        known: "Trabalho agêntico: seguir tarefas longas, acionar ferramentas e escrever código."
    note: "O DeepSeek é desenvolvido pela DeepSeek e o GLM pela Zhipu AI. Os nomes aparecem aqui só para descrever os modelos que a LESIS executa."
  how:
    eyebrow: "Como a LESIS opera"
    title: "Instalado na sua rede. <br>Operado pela LESIS."
    intro: >-
      Dimensionamos o hardware, instalamos a plataforma e o modelo dentro da sua rede e mantemos os dois atualizados. O seu time usa a LESIS normalmente, e nenhuma requisição sai da sua rede.
    steps:
      - title: "Dimensionamento"
        text: "Avaliamos o que vai ser analisado, quanto código e com que frequência, e especificamos os servidores e as GPUs de que o modelo precisa. Você compra o equipamento ou usa o que já tem."
      - title: "Instalação"
        text: "A plataforma e o modelo são instalados no seu data center ou na sua conta de nuvem privada como imagens de contêiner, com regras de rede que bloqueiam qualquer chamada a provedores de IA externos."
      - title: "Dentro da sua rede"
        text: "Revisão de código, verificação de achados e retestes rodam no modelo local. Os engenheiros da LESIS revisam os resultados pelo acesso que você concede e pode revogar a qualquer momento."
      - title: "Atualizações no seu ritmo"
        text: "Quando sai um modelo ou uma versão melhor, a LESIS testa primeiro em achados reais e só instala quando você aprova."
  closing:
    title: ["Leve o modelo até o seu código,", "não o seu código", "até o modelo."]
    text: "Conte onde o seu código está. Nós dizemos o que é preciso para rodar a LESIS aí."

