  ways:
    title: "Formas de trabalhar com a LESIS"
    intro: >-
      Trabalhe conosco em um problema técnico definido ou por meio de uma colaboração contínua de engenharia. As duas formas trazem pesquisa, orientação prática e acompanhamento dos achados.
    projects:
      title: "Projetos"
      lead: "Um trabalho com escopo fechado: um sistema, um objetivo técnico, um método e um cronograma definidos."
      services:
        - title: "Engenharia de Segurança"
          summary: "Trabalhamos ao lado dos seus engenheiros na arquitetura, nos controles de segurança e no ciclo de desenvolvimento seguro de um produto à medida que ele evolui."
          body:
            - >-
              Revisamos designs, mapeamos fronteiras de confiança e fluxos de dados, e ajudamos sua equipe a avaliar decisões de segurança antes e durante a implementação. A colaboração pode cobrir um sistema novo, uma migração ou mudanças em um produto existente, com investigação e validação focadas quando necessário.
            - >-
              Também incorporamos segurança de aplicações ao seu ciclo de desenvolvimento (SSDLC). Selecionamos, implementamos e ajustamos SAST, DAST e SCA para a sua stack e o seu pipeline de CI/CD, definimos os limites a partir dos quais um build falha e fazemos a triagem do que as ferramentas reportam, para que os engenheiros recebam achados reais e acionáveis em vez de uma fila de alertas. Quando faz sentido, usamos ferramentas que mantemos, como o <a href="https://github.com/lesis-lat/security-gate" target="_blank" rel="noopener noreferrer">Security Gate</a>.
        - title: "Pesquisa de Vulnerabilidades"
          summary: "Investigamos como o seu sistema pode ser comprometido, com evidências reproduzíveis e orientação para a correção."
          body:
            - >-
              Definimos o escopo da avaliação a partir do modelo de ameaças e da superfície de ataque do produto. Dependendo do sistema, o trabalho combina testes de aplicação e de infraestrutura, revisão de arquitetura e de código, e engenharia reversa. Investigamos cadeias de ataque, explicamos seu impacto e retestamos as correções.
        - title: "Ferramentas de Segurança Sob Medida"
          summary: "Construímos os fuzzers, analisadores e a instrumentação necessários para investigar o seu sistema."
          body:
            - >-
              Desenvolvemos ferramentas em torno de formatos, interfaces e comportamentos específicos, de harnesses de teste a análises sob medida. O escopo define o que a ferramenta precisa examinar e como sua equipe vai usá-la, seja em uma investigação focada ou em testes recorrentes.
            - >-
              Parte desse trabalho roda sobre modelos de linguagem, onde eles se saem melhor que uma regra fixa: revisar mudanças de código em busca de comportamento relevante para a segurança antes do merge, fazer a triagem da saída de analisadores diante do código para o qual ela aponta, ou testar as funcionalidades baseadas em modelos do seu próprio produto contra prompt injection e exposição de dados. Cada uma é medida diante dos casos que precisa detectar antes que sua equipe passe a depender dela.
        - title: "Investigação de Incidentes"
          summary: "Não conduzimos a resposta; entramos na equipe que conduz, para uma parte dela: estabelecer como a intrusão começou, e provar isso em vez de apenas afirmar."
          body:
            - >-
              A maior parte do que um incidente exige cabe à equipe que já está cuidando dele: contenção, erradicação, comunicação. Não assumimos isso. Nosso papel é a porta de entrada. Levamos as evidências de volta à fraqueza específica que tornou a intrusão possível e então demonstramos essa fraqueza, reproduzindo o caminho em vez de apontar uma causa provável, para que a conclusão se sustente quando alguém a questionar. O que sai daí não é uma narrativa, mas um achado: um ponto de entrada com evidências, uma severidade, um prazo e um reteste, vinculado na plataforma aos sistemas afetados e à linha do tempo da investigação de onde veio. Vale a pena contratar esse trabalho para um conjunto restrito de incidentes. Quando a porta de entrada já é conhecida, ou quando nada técnico foi explorado, não há nada para provarmos, e dizemos isso antes de o trabalho começar, não depois.
        - title: "Due Diligence"
          summary: "Avaliamos o que uma transação traz junto, seja uma empresa, uma base de código ou um produto que você está prestes a adotar, no prazo que a transação permite."
          body:
            - >-
              A decisão de adquirir, investir ou adotar algo é tomada contra um prazo, e geralmente com menos acesso do que em um projeto comum. Trabalhamos dentro dessas duas condições. Antes do fechamento do negócio, estabelecemos a postura de segurança do que está sendo comprado até a profundidade que o acesso disponível permite, e separamos o que é apenas desorganizado do que vai sair caro depois. Após o fechamento, os mesmos engenheiros examinam os sistemas adquiridos com o acesso que a nova propriedade permite, e apontam o que precisa ser resolvido antes de os ambientes serem integrados. O mesmo trabalho vale quando você está avaliando um produto em vez de uma empresa: nós o avaliamos em seu nome, sem nenhuma relação com o fornecedor. Em todos os casos, o resultado é um registro na plataforma, onde cada achado tem evidências, severidade e prazo e permanece aberto até ser corrigido, para que a avaliação continue útil para quem for responsável pelo sistema depois.
    program:
      title: "Colaboração contínua"
      lead:
        - "Trabalhe com uma equipe de engenharia de segurança que acumula conhecimento sobre os seus sistemas ao longo do tempo."
        - >-
          Juntos, definimos prioridades e uma cadência de revisões de design, avaliações focadas e investigação técnica. À medida que seu produto muda, revisitamos suas premissas e ajudamos seus engenheiros a lidar com novos riscos. A plataforma é onde esse trabalho se acumula: o contexto de cada revisão, avaliação e investigação passa para a próxima, para que sua operação de segurança pare de reconstruir o que já se sabe e cada ciclo vá mais fundo no problema.
    partners: >-
      Consultorias podem entregar nossas avaliações e pesquisas com a própria marca, ou nos indicar clientes, por meio do <a href="{partnership_url}">Programa de Parcerias da LESIS</a>, sem precisar montar uma equipe interna.

  record:
    eyebrow: "Pesquisa, experiência &amp; comunidade"
    title: "Trabalho que você pode verificar"
    intro: >-
      Divulgações públicas de vulnerabilidades, experiência em grandes empresas de tecnologia e contribuições à comunidade de segurança por meio de competições e palestras em conferências.
    items:
      - title: "Vulnerabilidades publicadas"
        text: >-
          Membros da nossa equipe reportaram vulnerabilidades à D-Link, documentadas na <a href="https://nvd.nist.gov/vuln/detail/CVE-2020-9376" target="_blank" rel="noopener noreferrer">CVE-2020-9376</a> e na <a href="https://nvd.nist.gov/vuln/detail/CVE-2020-9377" target="_blank" rel="noopener noreferrer">CVE-2020-9377</a>, e ao MISP, registrada como <a href="https://nvd.nist.gov/vuln/detail/CVE-2020-28043" target="_blank" rel="noopener noreferrer">CVE-2020-28043</a>. O trabalho deles também inclui reportes à Oracle e à Apple, com registros públicos no <a href="https://www.oracle.com/security-alerts/cpujul2022.html" target="_blank" rel="noopener noreferrer">Critical Patch Update de julho de 2022 da Oracle</a> e nos <a href="https://support.apple.com/en-gb/102774" target="_blank" rel="noopener noreferrer">agradecimentos de segurança de servidores web da Apple</a>.
      - title: "Competições de CTF"
        text: >-
          Membros da nossa equipe competiram em eventos de Capture The Flag, conquistando o primeiro lugar no CTF da BSides São Paulo e vencendo uma etapa classificatória do Hackaflag. A LESIS também apoia equipes da comunidade: no <a href="https://www.sbseg2026.uff.br/" target="_blank" rel="noopener noreferrer">SBSeg 2026</a>, a equipe do GRIS/UFRJ, apoiada pela LESIS, <a href="{bulletin_url}">ficou em primeiro lugar entre 18 equipes</a> em desafios de análise de tráfego, forense e investigação de incidentes.
      - title: "Experiência em líderes de mercado"
        text: >-
          Nossa equipe inclui engenheiros que trabalharam em empresas como o Nubank, o maior banco digital da América Latina, e a Globo, a maior empresa de mídia do Brasil, além dos principais fornecedores de cibersegurança do país e de outras empresas igualmente fortes, ainda que menos conhecidas. Eles trazem para o trabalho na LESIS a experiência com as exigências de engenharia de sistemas que atendem milhões de pessoas.
      - title: "Palestras em eventos de segurança"
        text: >-
          Membros da nossa equipe já apresentaram palestras em eventos como BxSec, Roadsec, BSides Rio de Janeiro e XibéSec. Essas contribuições levam a experiência da nossa equipe a discussões com outros profissionais de segurança e ajudam a compartilhar conhecimento na comunidade brasileira de segurança.

  work:
    transition: "Explore nossas pesquisas publicadas e ferramentas open source."
    tool: "Ferramenta open source"
    no_release: "Nenhuma versão publicada"
    tools:
      security_gate: "Aplique limites de segurança configuráveis aos alertas do GitHub para que sua equipe possa impor verificações no pipeline de CI/CD."
      bunkai: "Examine as dependências de projetos Perl em busca de módulos desatualizados e vulnerabilidades conhecidas, com resultados que se encaixam nos fluxos de desenvolvimento."
      kasumi: "Extraia e pesquise mensagens do Slack por palavra-chave e período para apoiar avaliações de segurança autorizadas."
    all_publications: "Todas as publicações &rarr;"
    explore_tools: "Conheça nossas ferramentas &rarr;"

  closing:
    title: ["Todo projeto começa", "pela pergunta", "que você realmente tem."]
    text: >-
      Conte o que você precisa descobrir: sobre um sistema que você opera, uma empresa que está prestes a comprar, um design que ninguém construiu ainda, ou algo que já aconteceu. Voltamos com o escopo, o método e o cronograma.

