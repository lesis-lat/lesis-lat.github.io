# --- Partnership ----------------------------------------------------------------
partnership:
  eyebrow: "Programa de Parcerias"
  title: "Amplie suas capacidades em cibersegurança com a LESIS."
  lead:
    - "O Programa de Parcerias da LESIS permite que empresas incorporem serviços especializados de cibersegurança ao seu portfólio sem precisar montar uma equipe interna de segurança ou investir em infraestrutura adicional."
    - "Por meio de modelos flexíveis de colaboração, os parceiros podem oferecer os serviços da LESIS com a própria marca, combinar nossa expertise com as soluções que já oferecem ou indicar clientes que precisam de suporte especializado em segurança."
  become: "Seja um parceiro"
  subject: "Parceria"
  levels_link: "Níveis de parceria"
  benefits:
    title: "Benefícios"
    intro: "O parceiro soma nossos engenheiros, nossa pesquisa e nossa plataforma ao que já oferece, e mantém o relacionamento com o cliente."
    items:
      - title: "Expertise especializada"
        text: "Acesse pesquisadores e consultores de segurança experientes para apoiar projetos complexos e críticos."
      - title: "Portfólio ampliado"
        text: "Adicione avaliações de segurança, pesquisa de vulnerabilidades, consultoria e ferramentas sob medida ao que você já oferece."
      - title: "Modelos flexíveis"
        text: "Escolha entre entrega white-label, parcerias de indicação ou ofertas de serviço integradas."
      - title: "Sem infraestrutura adicional"
        text: "Amplie suas capacidades em cibersegurança sem criar e manter uma equipe especializada interna."
      - title: "Suporte técnico e comercial"
        text: "Conte com suporte na avaliação de oportunidades, na definição de escopo, na elaboração de propostas e na entrega técnica."
      - title: "Soluções personalizadas"
        text: "Combine os serviços da LESIS com as suas próprias capacidades para criar ofertas sob medida para cada cliente."
  levels:
    title: "Níveis de parceria"
    intro: "O programa é estruturado em quatro níveis, com base no engajamento, nas oportunidades de negócio e na colaboração de cada parceiro com a LESIS."
    items:
      - name: "Bronze"
        text:
          - "O nível de entrada para empresas que estão começando a parceria com a LESIS."
          - "Inclui acesso aos materiais padrão de parceria, uma apresentação dos serviços da LESIS e suporte durante o processo inicial de vendas."
      - name: "Prata"
        text:
          - "Pensado para parceiros que estão desenvolvendo oportunidades recorrentes com a LESIS."
          - "Inclui todos os benefícios do nível Bronze, suporte comercial adicional e a participação da LESIS em reuniões selecionadas com clientes."
      - name: "Ouro"
        text:
          - "Para parceiros estabelecidos que trabalham de perto com a LESIS em oportunidades de cibersegurança."
          - "Inclui todos os benefícios dos níveis anteriores, suporte técnico ampliado e a possibilidade de desenvolver conteúdo co-branded e iniciativas conjuntas."
      - name: "Platina"
        text:
          - "O nível mais alto de parceria, pensado para relações estratégicas e de longo prazo."
          - "Inclui todos os benefícios dos níveis anteriores, suporte prioritário, colaboração mais próxima com a equipe da LESIS, acesso a iniciativas selecionadas e oportunidades de visibilidade conjunta em eventos e campanhas de co-marketing."
    note: "Os níveis de parceria e os critérios de elegibilidade são avaliados individualmente, com base no perfil, no engajamento e no relacionamento do parceiro com a LESIS."
  closing:
    title: ["Construa ofertas", "de segurança mais fortes", "com a LESIS."]
    text: "Seja para ampliar seu portfólio de serviços, entregar projetos de cibersegurança com a sua marca ou conectar seus clientes a expertise especializada em segurança, podemos ajudar você a definir o modelo de parceria certo."
