        text: >-
          Começar pelo que sua equipe precisa entender, decidir ou construir. Combinamos os objetivos, as restrições e as entregas, seja o trabalho sobre uma arquitetura, um controle de segurança, uma investigação técnica ou uma nova ferramenta.
