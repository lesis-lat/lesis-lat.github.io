# --- Home page ----------------------------------------------------------------
home:
  hero:
    title: "Cibersegurança sob medida <br>para a sua missão."
    lead: >-
      A LESIS é uma parceira, não um produto. Somos uma equipe de engenharia de segurança que trabalha de perto com cada cliente e molda o escopo, o método e as ferramentas ao sistema em questão. Nenhum projeto é igual ao outro.
    see_how: "Veja como trabalhamos"
    cards:
      - label: "Achado &middot; VUL-0417"
        title: "Sequestro de conta via XSS armazenado"
        meta: ["Severidade crítica, em correção", "Prazo em 2 dias", "Vinculado a portal.example.com"]
        badge: "Crítica"
      - label: "Investigação &middot; INV-0042"
        title: "Ações administrativas sem explicação no log de auditoria"
        meta: ["Severidade alta, em investigação", "Ponto de entrada reproduzido, evidências anexadas", "Vinculada a 2 achados e ao console administrativo"]
        badge: "Alta"
        note: "Linha do tempo aberta"
      - label: "Pesquisa &middot; TOOL-0031"
        title: "Fuzzer sob medida para a API de parceiros"
        meta: ["4,2 milhões de casos em 19 horas", "3 crashes triados, 1 reproduzível", "Registrado como VUL-0429, crítica"]
        badge: "Fuzzing"

  clients:
    label: "Organizações para as quais a LESIS reportou vulnerabilidades"
    title: "Quem já ajudamos a proteger"
    empty: "Fintechs, varejo, saúde, telecomunicações e lawtechs"

  what:
    eyebrow: "Sua parceira de P&amp;D em segurança"
    display: "O futuro da internet ainda não foi escrito. Estamos aqui para garantir que o próximo capítulo seja escrito com segurança."
    text:
      - >-
        Nossa abordagem parte de uma perspectiva minuciosa de atacante e de um pensamento orientado por pesquisa. Entendemos o que cada organização precisa e nos adaptamos a requisitos que mudam de uma para outra, para que o investimento em segurança se torne um diferencial para o negócio e os investimentos já feitos sejam preservados. A LESIS atende fintechs, varejo, saúde, telecomunicações e lawtechs.
      - >-
        Como instituição independente, sem vínculos com outras empresas ou investidores, somos neutros ao avaliar produtos e tecnologias, e nosso trabalho é julgado apenas pela sua qualidade. Nossos consultores têm mais de dez anos de experiência e já reportaram vulnerabilidades à D-Link (CVE-2020-9376 e CVE-2020-9377), Apple, Activision, Oracle e MISP (CVE-2020-28043).

  execution:
    eyebrow: "Como executamos"
    display: "Segurança não é linear. Nossa execução também não."
    text: >-
      No modelo tradicional, um único analista conduz toda a avaliação. A LESIS conduz cada projeto como um esforço colaborativo, com vários especialistas trabalhando no mesmo sistema ao mesmo tempo, cada um trazendo uma formação diferente.
    items:
      - title: "Maior cobertura técnica"
        text: "Mais componentes examinados, e mais de uma forma de examinar cada um deles."
      - title: "Menos vieses individuais"
        text: "Nenhuma suposição sobre o sistema deixa de ser questionada."
      - title: "Validação cruzada dos achados"
        text: "Cada vulnerabilidade é confirmada por mais de um engenheiro antes de ser registrada."
      - title: "Cenários mais profundos"
        text: "Tempo para seguir uma cadeia de fraquezas até o que ela realmente expõe."

  engineering:
    eyebrow: "O que fazemos"
    title: "Acompanhamos problemas de segurança do design ao código e à execução."
    intro: >-
      Segurança de aplicações, revisão de arquitetura e segurança da cadeia de suprimentos de software, apoiadas por análise estática, fuzzing, engenharia reversa e desenvolvimento de exploits. Reunimos essas disciplinas para investigar o seu sistema.
    items:
      - title: "Revisar o design do sistema"
        text: "Mapear fronteiras de confiança, revisar a arquitetura e avaliar os controles de segurança para entender como as decisões de design afetam a exposição do sistema a ataques."
      - title: "Investigar como ele pode falhar"
        text: "Combinar pentest, revisão de código, análise estática e engenharia reversa para encontrar fraquezas e, em seguida, desenvolver exploits para verificar como elas podem ser usadas e estabelecer seu impacto."
      - title: "Construir ferramentas para ir mais fundo"
        text: "Construir harnesses de fuzzing, analisadores sob medida e instrumentação para alcançar caminhos de código complexos, examinar o comportamento em tempo de execução e investigar fraquezas que pedem um olhar mais atento."

  journey:
    eyebrow: "Como um projeto acontece"
    title: "Entender o sistema. Deixar sua equipe mais forte."
    intro: >-
      Trabalhamos com seus engenheiros para transformar uma pergunta de segurança em um resultado que eles possam usar: um design, uma decisão técnica, um achado de pesquisa ou uma ferramenta funcionando. Os métodos e as entregas seguem o problema. Ao longo do projeto, construímos o entendimento de que sua equipe precisa para levar o trabalho adiante.
    steps:
      - label: "Contexto"
        title: "Entender o contexto"
        text: >-
          Estudar os sistemas, os fluxos de trabalho e os requisitos dos quais o trabalho depende. Examinamos pesquisas existentes e abordagens disponíveis, identificamos suposições e estabelecemos quais perguntas precisam de mais investigação.
        toolbar: "Contexto &middot; mapa do sistema"
        count: "12 componentes"
        subhead: "Onde o trabalho se apoia em suposições"
        links: ["4 fronteiras de confiança", "1 suposição a testar", "2 relatórios anteriores"]
