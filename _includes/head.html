<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src-elem 'self' https://cdnjs.cloudflare.com; style-src-attr 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https://cdnjs.cloudflare.com; connect-src 'self' https://blog.lesis.lat https://*.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>{{ page.title | escape }}</title>
<meta name="description" content="{{ page.description | escape }}">
<meta name="keywords" content="{{ page.keywords | escape }}">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:title" content="{{ page.title | escape }}">
<meta property="og:description" content="{{ page.description | escape }}">
<meta property="og:url" content="{{ site.url | escape }}{{ page.url | escape }}">
<meta property="og:type" content="website">
<meta property="og:image" content="{{ site.url }}/assets/images/SitePreview.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title | escape }}">
<meta name="twitter:description" content="{{ page.description | escape }}">
<meta name="twitter:image" content="{{ site.url }}/assets/images/SitePreview.png">
<link rel="icon" href="{{ '/assets/images/favicon-white.png' | relative_url }}" type="image/png">
<link rel="apple-touch-icon" href="{{ '/assets/images/favicon-white.png' | relative_url }}">
{% assign stylesheet_version = site.time | date: '%s' %}
<link rel="stylesheet" href="{{ '/assets/css/style.min.css' | relative_url }}?v={{ stylesheet_version }}">
{% if page.url == "/" %}<link rel="preload" href="{{ '/assets/images/bell-labs.avif' | relative_url }}" as="image" type="image/avif" fetchpriority="high">
{% endif %}{% unless page.layout == "landing" or page.layout == "newsletter" %}<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" integrity="sha384-SZXxX4whJ79/gErwcOYf+zWLeJdY/qpuqC4cAa9rOGUstPomtqpuNWT9wdPEn2fk" crossorigin="anonymous" referrerpolicy="no-referrer">{% endunless %}
<link rel="preload" href="{{ '/assets/fonts/woff2/plex-sans-300-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ '/assets/fonts/woff2/plex-mono-400-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
